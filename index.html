M('ng76',1976,'군 내부의 새로운 인사 모임','선배 장교들이 비공식 모임에서 정치의 장래를 이야기한다.','당신은 한 장교의 추천으로 내부 모임에 초청받았다. 아직 누구도 향후 권력 변화를 확신하지 못한다.',[C('전두환 측 인맥과 거리를 좁힌다','조직 내 신뢰를 얻지만 독자성은 줄어든다.',{network:11,org:8,legitimacy:-3},'신흥 군 인맥에 이름을 알렸다.','진영 결속'),C('군 내부 중립을 지킨다','조직의 신뢰는 덜 얻지만 독자 위치를 확보한다.',{trust:9,policy:6,org:-2},'군 내부에서 독립적 인사로 남았다.','독자 입장'),C('문민 정치 인맥도 병행한다','상부의 경계와 새로운 접촉이 동시에 생긴다.',{network:10,parliament:5,control:-3},'군과 정치권 사이 연결이 생겼다.','민군 접촉')]),

M('ng78',1978,'두 노선, 두 후원자','전두환과 다른 군 내부 인사가 당신의 향후 진로에 관심을 보인다.','누구의 후원을 받느냐에 따라 1979년 정치적 위기의 위치가 달라질 수 있다.',[C('전두환의 측근 노선을 선택한다','조직 안에서 입지를 강화한다.',{network:12,org:9,legitimacy:-4},'측근 인사로 분류되기 시작했다.','신흥 군 인맥'),C('중립적 행정 경력을 준비한다','군정의 전문성에 집중한다.',{policy:13,trust:6,network:-4},'제도와 행정에 강한 인물로 알려졌다.','군 행정 노선'),C('새 정치조직을 구상한다','기존 인맥을 잃는 대가가 따른다.',{org:12,partyFunds:-1,network:-8},'정치적 독립 노선을 만들었다.','독립 노선')])],
yushin:[
M('yu76',1976,'여권 후원 인맥의 재편','청와대와 집권당을 잇는 인사들이 새로운 후계자 후보를 찾기 시작한다.','1975년 이후 정치적 긴장이 이어지는 가운데 집권세력 내부의 후원 경쟁이 발생한다.',[C('여권 핵심에 의존한다','보호받을 수 있지만 독자성은 낮다.',{network:12,control:8,trust:-6},'여권 원로들의 지원을 받았다.'),C('지역당 조직을 독립적으로 육성한다','시간과 비용을 쓴다.',{org:14,partyFunds:-2,control:-3},'지역 기반을 별도로 만들었다.'),C('관료 실무조직을 구축한다','정치 권한보다 정책 인맥을 얻는다.',{policy:12,network:6},'행정 관료와 연결망을 쌓았다.')]),
M('yu78',1978,'여권 내부 후계 구도','기존 권력의 다음 주자들을 둘러싼 갈등이 커진다.','당 지도부는 충성을 요구하지만 각 세력의 이해관계가 다르다.',[C('기존 지도부에 남는다','상층부 지지를 받는다.',{control:9,network:9,opposition:8},'지도부가 당신을 주목했다.'),C('대안적인 후계 협의체를 제안한다','경쟁자들을 설득해야 한다.',{policy:9,org:9,control:-3},'새로운 내부 협의가 시작됐다.'),C('야당과 제한된 의회 협의를 연다','당내 의심도 받는다.',{parliament:10,legitimacy:7,network:-5},'정당 간 비공식 대화가 진행됐다.')])],
reform:[
M('rf76',1976,'야권 조직의 갈림길','기성 정치인과 재야 활동가가 조직 운영 방향을 놓고 갈등한다.','야당 정치 경험이 적은 당신에게 양측이 도움을 청한다.',[C('기성 야당 조직과 협력한다','의회 연결을 확보한다.',{parliament:9,network:8,org:4},'신민당과 가까워졌다.'),C('재야 네트워크를 지원한다','정치적 위험과 조직 확대가 동시에 생긴다.',{org:13,support:8,control:-5},'재야 인사들의 신뢰를 얻었다.'),C('조직 통합 회의를 제안한다','대립을 중재한다.',{policy:9,trust:10,network:-2},'협의체를 설립했다.')]),

M('in76',1976,'자본과 조직의 첫 연결','사업 인맥이 새로운 정치조직 후원 가능성을 타진한다.','경제적 지원을 받은 뒤 독립성을 지킬 수 있을지 고민해야 한다.',[C('공개된 투자·후원만 받는다','규정을 지키며 기반을 조성한다.',{partyFunds:4,network:7,trust:5},'공개적인 재정 기반을 만들었다.'),C('본업을 확장한다','개인 자산을 우선 늘린다.',{wealth:9,org:-3},'사업 자산이 늘었다.'),C('기존 정당 인재를 영입한다','조직력은 올라가지만 비용이 든다.',{org:12,network:8,partyFunds:-2},'독립적인 정당 인재망이 시작됐다.')]),

opposition08:[M('o08x',2009,'야권 재편의 첫 회의','서로 다른 야권 세력들이 선거와 조직 결합을 논의한다.','위기 국면에서 여당과의 차별화와 독자 정책이 쟁점이 된다.',[C('공동 비상대책위원회를 구성한다','야권 조직을 결속한다.',{org:12,network:8},'야권 조직이 정비됐다.'),C('경제정책을 전면에 세운다','정책 전문성을 높인다.',{policy:13,support:6},'대안 경제정책이 주목받았다.'),C('지역 정치인 중심의 신세력을 만든다','내부 경쟁을 감수한다.',{org:10,network:-7,media:7},'독자 정치그룹이 출현했다.')])],

independent08:[M('i08x',2009,'새 정당 창설 비용','기존 정당을 떠난 정치인들의 참여 요청이 들어왔다.','새 정치조직은 인물·자금·인지도 모두 부족하다.',[C('당원 모집부터 시작한다','조직 기틀을 쌓는다.',{org:14,partyFunds:-2},'새 조직이 빠르게 결성됐다.'),C('전문직 인사를 합류시킨다','정책 역량을 높인다.',{policy:10,network:8,wealth:-3},'새 정당의 인재 구성이 달라졌다.'),C('기성 정당과 공동 명단을 협의한다','독자성은 떨어진다.',{parliament:11,org:-6,network:8},'연합 노선을 택했다.')])]},

function setEvent(){
 if(!g||g.ended||g.pending||g.flash||g.election||g.lastChance||g.boss75?.status==='fighting')return;
 ensureNarrative();maybeUrgent();
 let landmark=(milestones[g.era]||[]).find(e=>e.year===g.year&&!g.decisions[e.id]);
 let isMajor=!!(g.half===0&&landmark);
 // 소속 정당의 공천과 선거는 이야기 진행 중 자동으로 시작한다.
 if(!isMajor&&maybeAutoPoliticalContest()){save();return}
 // 이전 선택이 유발한 후속 사건 → 진영별 기존 이야기 → 일반 기반 사건 순서.
 let story=storyPick();let generic=one(eligibleEvents());
 let e=isMajor?landmark:(story||generic);if(!e)e=generics[0];
 if(e===landmark)e=branchEvent(e);
 e=tailorEvent(e,isMajor,!!story);
 let choices=[...e.choices];for(let i=choices.length-1;i>0;i--){let j=rnd(0,i);[choices[i],choices[j]]=[choices[j],choices[i]]}
 g.pending={id:e.id,title:e.title,short:e.short,detail:e.detail,choices,year:g.year,major:isMajor,story:!isMajor&&!!story,factionTailored:!!e.factionTailored};
}
function skipToHistory(){if(!g||g.ended||g.flash||g.election||g.pending?.major)return;
 if(g.finances.some(f=>!f.resolved&&f.risk>=18)||g.internalSupport<32||g.threat>58){alert('현재 진행 중인 자금 조사 또는 권력투쟁이 있어 역사 분기를 건너뛸 수 없습니다.');return}
 let next=(milestones[g.era]||[]).find(x=>x.year>g.year&&!g.decisions[x.id]);if(!next)return;
 let diff=next.year-g.year;if(!confirm(`${next.year}년으로 이동하시겠습니까? (${diff}년의 일반 정치 활동이 생략됩니다.)`))return;
 historyNote('정치 활동 기간 생략',`${g.year}년에서 ${next.year}년으로 이동했다. 주요 역사적 사건은 남아 있다.`);
 g.year=next.year;g.age+=diff;g.half=0;g.actionLeft=1;g.pending=null;
 setEvent();save();render();window.scrollTo(0,0);
}
function applyChoice(i){
 if(!g?.pending||g.ended||g.flash||g.election)return;
 let e=g.pending,c=e.choices[i];if(!c)return;
 let del={...c.delta};if(g.job==='finance'&&e.id==='e08'&&c.label.includes('분산'))del.wealth=(del.wealth||0)+6;
 if(g.job==='soldier'&&e.id==='y79'&&c.branch==='군부 영향력 확대')del.network=(del.network||0)+6;
 let changes=mod(del);let beforeIntrigue={internalSupport:g.internalSupport,leaderTrust:g.leaderTrust,rivalInfluence:g.rivalInfluence,positionScore:g.positionScore};
 // 현재 세력의 결집과 지도부 신임은 각기 별도인 값이다.
 g.internalSupport=lim(g.internalSupport+Math.round((del.org||0)*.22+(del.network||0)*.09+(del.trust||0)*.13-(del.opposition||0)*.13));
 g.leaderTrust=lim(g.leaderTrust+Math.round((del.network||0)*.12+(del.control||0)*.07-(del.legitimacy||0)*-.02));
 g.positionScore=lim(g.positionScore+Math.round(((del.org||0)+(del.network||0))/7)+(e.major?3:1));
 g.factionPower[g.faction]=lim((g.factionPower[g.faction]||30)+Math.max(-7,Math.min(9,Math.round(((del.org||0)+(del.control||0))/5))));
 if(e.id==='power_shadow'&&c.label.includes('수용')){g.fundingRisk=lim(g.fundingRisk+36);g.exposure=lim(g.exposure+29);historyNote('자금 조사 위험 증가','당시 수락한 자금의 출처가 향후 정치 활동의 약점으로 남았다.');}
 processStoryChoice(c,e);processFactionChoice(c);
 for(let [k,old] of Object.entries(beforeIntrigue))if(g[k]!==old)changes.push({key:k,delta:g[k]-old});
 if(c.branch){g.branch=c.branch;if(e.major)g.regime=c.branch}
 g.decisions[e.id]={choice:c.label,branch:c.branch||null,year:g.year};
 g.storySeen.push(e.id);g.storySeen=g.storySeen.slice(-200);
 historyNote(e.title,c.mark+(c.branch?` [분기: ${c.branch}]`:''));
 g.seen.push(e.id);g.seen=g.seen.slice(-40);g.pending=null;
 if(['y79','e12','f28'].includes(e.id))for(let r of Object.values(g.relations)){r.score=lim(r.score+(r.p===g.party?rnd(1,4):-rnd(1,3)))}
 if(e.id.startsWith('finance_')||e.id.startsWith('faction_switch_')){g.actionLeft=Math.max(0,g.actionLeft-1);g.yearPromptYear=-1;}
 if(!g.ended){afterNarrativeTurn();if(!g.ended&&!g.lastChance)g.flash={heading:c.mark,branch:c.branch||'',changes}}
 save();render();window.scrollTo(0,0);
}
function continueGame(){if(!g||g.ended)return;
 if(g.flash){let auxiliary=!!g.flash.auxiliary;g.flash=null;
 if(auxiliary){save();render();window.scrollTo(0,0);return}
 g.half++;if(g.half>=4){g.half=0;g.year++;g.age++;g.actionLeft=1;g.yearPromptYear=g.year;g.financeNudgeSeen=false;g.briefHistory.push({year:g.year,text:annualBriefing(g.year)});g.briefHistory=g.briefHistory.slice(-14);
 g.rivalInfluence=lim(g.rivalInfluence+rnd(1,4));
 if(g.leaderTrust<33)g.internalSupport=lim(g.internalSupport-rnd(2,5));
 if(g.office==='대통령'){g.term++;if(g.term>=5){g.office='정당 대표';historyNote('대통령 임기 종료','대통령 임기의 정치적 기록이 연대기에 남았다.');g.term=0}}
 }
 afterNarrativeTurn();if(!g.ended&&!g.lastChance)setEvent();save();render();window.scrollTo(0,0);
 }}

function requirements(){return [{type:'assembly',name:'국회의원',rules:{org:35,policy:32,support:30},fund:2},{type:'leader',name:'당 대표',rules:{org:50,network:42,support:38},fund:3},{type:'president',name:'대통령',rules:{org:61,policy:52,support:55,network:49},fund:5}]}
function reqPage(){ensureNarrative();let yr=g.era===1975?1978:g.era===2008?2012:2028;return `<div class="tag">POLITICAL CAREER</div><h2 class="title">다음 권력 경쟁</h2><div class="card"><div class="label">현재 지위</div><h3 class="title" style="font-size:21px">${esc(g.office)}</h3><p>현재 소속: ${esc(FACTION_NAME(g.era,g.faction))}</p><div class="columns"><div class="kpi"><strong>${g.positionScore}</strong><span>조직 내 위치</span></div><div class="kpi"><strong>${g.internalSupport}</strong><span>당내 지지</span></div></div><p class="small muted">공천과 선거는 능력치만으로 임의 신청할 수 없습니다. 현재의 이야기, 역사적 시점, 조직의 지지에 따라 자동으로 진행됩니다.</p></div><div class="card"><div class="tag">다음 주요 정치 일정</div><h3 class="title">${g.era===1975&&['yushin','newguard'].includes(g.faction)?'지도부 후계 경쟁 · 조직 내 권력투쟁':yr+'년 총선 후보 선출과 선거'}</h3><p class="small muted">${g.year>=yr?'진행 중인 정치 질서와 지난 결정이 다음 도전을 결정합니다.':`현재 ${g.year}년. 필요한 시점이 오면 별도 사건과 개표 방송이 열립니다.`}</p></div><div class="card"><div class="label">선출·권력 경쟁의 주요 변수</div>${[['org','정치 조직'],['support','대중 지지'],['policy','정책 역량'],['network','인맥'],['internalSupport','당내 지지']].map(([k,n])=>`<div class="meterline"><span style="width:100px;font-size:12px">${n}</span><div class="bar"><i style="width:${g[k]}%"></i></div><b>${g[k]}</b></div>`).join('')}</div>`}
const rounds=[{title:'후보 선출을 위한 공개 논의',intro:'정당 내부의 경쟁자들과 입장을 설명할 기회다.',opts:[['공개 정책 토론에 집중', 'policy',6],['지역 조직을 결집','org',7],['다른 세력과 협의', 'network',6]]},{title:'공천 심사 최종 단계',intro:'지도부와 유권자의 판단이 엇갈리고 있다.',opts:[['정책 성과 공개','policy',7],['당내 합의와 절차 강조','trust',8],['지역 일정에 집중','support',7]]},{title:'본선 공개 토론',intro:'최종 후보와 정책을 비교하는 방송이 진행된다.',opts:[['국가정책 비전 제시','policy',8],['지역 유권자 문제 집중','support',8],['정치적 협력 능력 강조','network',8]]},{title:'투표일 전 마지막 일정',intro:'당선 여부는 아직 알 수 없다.',opts:[['공개 지지 행사','media',7],['정당 조직 정비','org',7],['공식 정책자료 발표','trust',8]]}];
function startElection(type){if(g.election||g.flash)return;let r=requirements().find(x=>x.type===type);if(!r||!Object.entries(r.rules).every(([k,v])=>g[k]>=v)||g.partyFunds<r.fund)return;g.partyFunds-=r.fund;g.election={opponent:randomRivalName(g.name),type,step:0,score:0,nomDone:false,done:false,progress:0,ours:50,theirs:50,final:50};tab='election';save();render()}
function campaignPage(){let e=g.election;if(!e)return reqPage();if(e.step<4){let r=rounds[e.step];return `<div class="row between"><span class="tag">${e.step<2?'공천 경선':'본선 선거'}</span><span class="pill">${e.step+1} / 4</span></div><div class="hero"><h2>${r.title}</h2><p class="lede">${r.intro}</p><p class="small muted">${esc(g.name)} vs ${esc(e.opponent||(e.opponent=randomRivalName(g.name)))}</p></div><div class="card"><div class="tag">이번 장면에서의 대응</div>${r.opts.map((o,i)=>`<button class="btn opt" onclick="campaignChoice(${i})"><span class="n">0${i+1}</span><span class="text"><strong>${o[0]}</strong><span class="desc">${statLabels[o[1]]} 능력치가 반영됩니다.</span></span></button>`).join('')}</div><div class="card"><div class="label">현재 준비 상태</div><div class="row between"><strong>${esc(g.party)}</strong><strong>${g.support} / 100</strong></div><div class="bar"><i style="width:${g.support}%"></i></div><p class="small muted">가상 정치 시뮬레이션이며 실제 선거 예측이 아닙니다.</p></div>`}return electionBroadcast()}
function campaignChoice(i){let e=g.election;if(!e||e.step>=4)return;let r=rounds[e.step],o=r.opts[i],stat=g[o[1]],bonus=(stat-35)/8 +o[2]+rnd(-5,5);e.score+=bonus;if(e.step===1){let val=(g.org*.25+g.network*.21+g.trust*.18+g.support*.2+e.score*1.3);if(val<47){g.internalSupport=lim(g.internalSupport-24);g.rivalInfluence=lim(g.rivalInfluence+14);g.history.unshift({y:g.year,title:'공천 경선 탈락',desc:'당내 후보 선출 과정에서 경쟁에 패했다.'});g.flash={heading:'공천 경선에서 탈락했다.',branch:'',changes:[]};g.election=null;tab='event';save();render();return}e.nomDone=true}e.step++;if(e.step>=4){let base=(g.org*.17+g.policy*.12+g.support*.28+g.network*.10+g.media*.08+g.trust*.11+g.parliament*.04)+(e.score*.32);let final=lim(37+(base-35)*.25+rnd(-11,11),22,78);e.final=Math.round(final*10)/10;e.progress=0;e.ours=50;e.theirs=50;}save();render();if(e.step>=4)beginCount()}
function electionBroadcast(){let e=g.election;return `<div class="tag">ELECTION NIGHT · LIVE COUNT</div><h2 class="title" style="font-size:24px">${e.type==='president'?'대통령 선거':e.type==='leader'?'정당 대표 경선':'국회의원 선거'} 개표 중계</h2><div class="card"><div class="row between"><strong>${esc(g.name)} vs ${esc(e.opponent||(e.opponent=randomRivalName(g.name)))}</strong><span class="badge">가상 집계</span></div><div class="countup" id="countLabel">개표 ${Math.round(e.progress)}%</div><div class="score"><div><small>${esc(g.name)}</small><strong id="ourScore">${e.ours.toFixed(1)}%</strong></div><div style="text-align:right"><small>${esc(e.opponent||(e.opponent=randomRivalName(g.name)))}</small><strong id="theirScore">${e.theirs.toFixed(1)}%</strong></div></div><div class="vote"><i class="ours" id="voteBar" style="width:${e.ours}%"></i><i class="theirs"></i></div><div class="bar" style="height:4px"><i id="countBar" style="width:${e.progress}%"></i></div><p class="small muted" style="margin-top:12px">실제 정치인·유권자의 득표를 예측하는 결과가 아닌 게임 속 가상 방송 연출입니다.</p></div><button class="btn primary full" id="finishCount" ${e.progress<100?'disabled':''} onclick="finishElection()">최종 결과 확인 →</button>${e.progress<100?'<button class="btn full ghost" onclick="skipCount()" style="margin-top:7px">개표 완료까지 건너뛰기</button>':''}`}
function beginCount(){if(revealTimer)clearInterval(revealTimer);if(!g?.election||g.election.step<4||g.election.progress>=100)return;revealTimer=setInterval(()=>{let e=g?.election;if(!e||e.step<4||e.progress>=100){clearInterval(revealTimer);revealTimer=null;return}e.progress=Math.min(100,e.progress+4);let noise=(1-e.progress/100)*(Math.sin(e.progress*.62)*9+rnd(-3,3));let p=lim(50+(e.final-50)*e.progress/100+noise,8,92);if(e.progress===100)p=e.final;e.ours=Math.round(p*10)/10;e.theirs=Math.round((100-p)*10)/10;for(let [id,t] of [['countLabel','개표 '+e.progress+'%'],['ourScore',e.ours.toFixed(1)+'%'],['theirScore',e.theirs.toFixed(1)+'%']]){let el=$(id);if(el)el.textContent=t}if($('voteBar'))$('voteBar').style.width=e.ours+'%';if($('countBar'))$('countBar').style.width=e.progress+'%';if(e.progress===100){clearInterval(revealTimer);revealTimer=null;save();render()}},130)}
function skipCount(){if(!g?.election)return;if(revealTimer)clearInterval(revealTimer);revealTimer=null;let e=g.election;e.progress=100;e.ours=e.final;e.theirs=Math.round((100-e.final)*10)/10;save();render()}
function finishElection(){let e=g.election;if(!e||e.progress<100)return;let won=e.final>50,office={assembly:'국회의원',leader:'정당 대표',president:'대통령'}[e.type];let old=g.office;if(won){g.office=office;g.won++;g.control=lim(g.control+(e.type==='president'?27:e.type==='leader'?15:6));g.parliament=lim(g.parliament+(e.type==='assembly'?19:e.type==='president'?12:7));g.support=lim(g.support+8);g.phase=office==='대통령'?'국정 운영':office==='국회의원'?'입법 활동':'당권 운영';g.term=0}else{g.support=lim(g.support-12);g.org=lim(g.org-7);g.internalSupport=lim(g.internalSupport-17);g.rivalInfluence=lim(g.rivalInfluence+13);if(g.internalSupport<24||g.rivalInfluence>79)makeEnding('경선·선거 참패 뒤 축출',`후보 ${esc(e.opponent||'경쟁자')}에게 패배한 뒤 당내 지지층이 이탈했다.`,'공천 및 선거 패배');}g.history.unshift({y:g.year,title:won?office+' 당선':office+' 도전 실패',desc:`가상 개표 ${e.final.toFixed(1)}% : ${(100-e.final).toFixed(1)}%. ${won?`정치적 지위가 ${old}에서 ${office}(으)로 변경됐다.`:'경쟁에서 패배했지만 조직은 남았다.'}`});g.election=null;g.flash={heading:won?office+'에 당선되었습니다.':'선거에서 패배했습니다.',branch:won?'권력 구조 변화':'',changes:[{key:'support',delta:won?8:-7}],auxiliary:true};tab='event';save();render()}
function historyPage(){return `<div class="tag">CHANGED HISTORY</div><h2 class="title">당신이 바꾼 대한민국</h2><div class="card"><div class="label">지금의 국가적 흐름</div><h3 style="margin:8px 0;font-size:20px">${esc(g.branch)}</h3><p class="small muted">선택한 과거는 되돌아가지 않습니다. 역사적 사건의 전개는 현재의 국가 질서에 영향을 받습니다.</p></div><div class="history">${g.history.map(x=>`<article><span class="tag">${x.y}년</span><strong>${esc(x.title)}</strong><p>${esc(x.desc)}</p></article>`).join('')}</div>`}

function factionLabel(era,id){let original=factionById(era,id).name;if(era!==1975||!g||g.era!==1975)return original;let y=g.year;if(g.decisions?.park79==='survived')return original;if(y>=1988){return {newguard:'구집권 군부 잔류파',yushin:'구여권 보수 세력',reform:'민주화 정당 연합',independent:'독자 정당 세력'}[id]||original}if(y>=1981){return {newguard:'신군부·제5공화국 핵심',yushin:'구유신 잔류 세력',reform:'민주화 야권 연합',independent:'독자 정치 연합'}[id]||original}if(y>=1979){return {newguard:'군 내부 신흥 권력파',yushin:'구집권 핵심 세력',reform:'야권·민주화 진영',independent:'독자 권력 세력'}[id]||original}return original}

function personStatus(name){if(!g)return 'active';if(name==='박정희'&&g.era===1975&&g.boss75?.status==='victory'&&g.boss75?.target==='박정희')return 'retired';if(name==='박정희'&&g.era===1975&&g.decisions?.park79==='survived')return 'active';let y=historicalDeaths[name];if(y&&g.year>=y){if(name==='박정희'&&g.year===1979&&!g.urgentSeen.includes('park_warning'))return 'active';return 'deceased'}return 'active'}

const yearChronicle={1975:['긴급조치 9호 이후 통제와 저항이 이어진다.','유신 정권의 내부 신뢰도와 야권 움직임이 충돌한다.'],1976:['3·1 민주구국선언 등 유신체제 비판이 이어진다.','권력 내부는 충성의 기준을 다시 묻는다.'],1977:['여권 관료와 군 내부의 후계 관측이 퍼진다.','지방 조직을 장악하려는 중간 간부들의 경쟁이 거세진다.'],1978:['제10대 국회의원 선거로 여야 권력 지형이 시험받는다.','공천을 둘러싼 내부 반란이 이어진다.'],1979:['부마민주항쟁과 10·26, 12·12로 역사적 권력 공백이 발생했다.','대통령 사망 이후 집권 질서가 급격하게 재편되었다.'],1980:['서울의 봄과 5·18 민주화운동을 거쳐 새로운 국가 권력 질서가 형성되었다.','권력에 접근한 집단과 배제된 집단의 간극이 확대되었다.'],1981:['제5공화국이 출범하고 집권 세력의 제도적 기반이 재편되었다.','전 정권 인사들의 운명이 갈리고 새로운 인맥이 떠오른다.'],1982:['장영자·이철희 어음 사건 등 경제 비리 파문이 정치권을 뒤흔들었다.','자금과 권력의 연결고리가 약점으로 떠오른다.'],1983:['아웅산 묘소 폭탄 테러로 정부 인사가 희생되고 정국에 충격이 발생했다.','권력층의 공백과 후임 인사를 둘러싼 분쟁이 격해진다.'],1984:['야권과 시민사회가 정치적 영향력 회복을 모색한다.','집권당 내부에서 후계 관리와 정책 갈등이 누적된다.'],1985:['제12대 국회의원 선거에서 신한민주당이 약진했다.','직선제 개헌 요구가 큰 의제로 떠오른다.'],1986:['대통령 직선제 개헌을 둘러싼 여야 대립이 확대되었다.','세대교체를 주장하는 인사들이 기존 지도부와 맞선다.'],1987:['6월 민주항쟁과 6·29 선언 이후 대통령 직선제 개헌이 이루어졌다.','12월 대통령 선거로 정치 연합과 분열이 가속했다.'],1988:['제13대 국회의원 선거 결과 여소야대 국회가 만들어졌다.','제5공화국 청문회가 이전 권력의 책임을 공론화했다.'],1989:['여소야대 국회의 협상과 대립이 길어졌다.','정계 개편 구상이 정치권 중심 의제로 등장한다.'],1990:['민주정의당·통일민주당·신민주공화당의 3당 합당이 이루어졌다.','거대 여당 출범으로 내부 지분 경쟁이 벌어진다.'],1991:['지방자치제의 부활이 지역 정치 조직을 변화시켰다.','지역 당권과 중앙 공천권의 갈등이 커졌다.'],1997:['외환위기로 금융과 고용이 흔들렸다.','경제 정책의 책임과 권력 이양이 쟁점이 되었다.'],2008:['세계 금융위기가 국내 정책과 기업 경영을 압박했다.','여당 내 노선 경쟁과 야권 재편이 동시에 벌어졌다.'],2010:['지방선거와 정치적 연합이 각 정당의 영향력을 시험했다.','당 안팎에서 새로운 후보를 찾는 움직임이 확대되었다.'],2012:['국회의원 선거와 대통령 선거가 이어졌다.','후보 선출과 지역 연합이 권력 변화를 이끌었다.'],2016:['총선 이후 국회 권력의 균형이 달라졌다.','대통령 탄핵 정국이 이어졌다.'],2017:['대통령 파면 뒤 조기 대선이 치러졌다.','정당 지도부의 권력 구도가 다시 짜였다.'],2026:['정당별 입지와 지도부 신뢰를 두고 가상 정치사가 시작된다.','현대 정치의 공개 경쟁과 조직 내 암투가 병행된다.']};
function annualBriefing(year){if(g?.era===1975&&g.boss75?.status==='victory'&&year>=g.boss75.completedYear)return `대체역사: ${g.name}이(가) ${g.boss75.completedYear}년 정점의 권력 경쟁에서 승리했다. 군 내부 균열과 제도적 정당성 논쟁, 반대파의 복귀 시도가 계속된다.`;const facts=yearChronicle[year];let basic=facts?facts[0]+' '+facts[1]:`${year}년, 계파 간 권력 재분배와 의회 협상, 자금 및 조직의 갈등이 지속된다.`;if(g?.era===1975&&year===1979&&g.year===1979&&!g.urgentSeen.includes('park_warning'))return '유신체제의 정당성 논쟁과 여야 갈등이 심해지고 있다. 지도부는 겉으로 평온하지만 내부적으로 권력 재편 가능성을 탐색한다.';if(g?.era===1975&&g.decisions?.park79==='survived'&&year>=1979){return `대체역사: 박정희가 생존해 기존 역사와 다른 체제가 이어진다. ${year}년의 집권세력 내부에서 후계 문제와 권력 투쟁이 심화된다.`}return basic}

/* Original procedurally composed score. No audio downloads, samples or third-party tracks. */
const musicEngine={ctx:null,master:null,playing:false,timer:null,step:0,nextTime:0};
function musicButton(){let on=musicEngine.playing;return `<button class="bgm-toggle ${on?'on':''}" onclick="toggleBgm()" aria-label="배경음악 ${on?'끄기':'켜기'}" aria-pressed="${on}" title="자체 제작 배경음악">${on?'♫ BGM ON':'♪ BGM OFF'}<small>${on?'누르면 끔':'눌러서 재생'}</small></button>`}
function midiFreq(n){return 440*Math.pow(2,(n-69)/12)}
function musicTone(freq,time,length,loudness,wave='sine',detune=0){
 const ctx=musicEngine.ctx,bus=musicEngine.master;if(!ctx||!bus)return;
 const osc=ctx.createOscillator(),amp=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,time);osc.detune.value=detune;
 amp.gain.setValueAtTime(.0001,time);amp.gain.exponentialRampToValueAtTime(Math.max(.0002,loudness),time+.04);
 amp.gain.exponentialRampToValueAtTime(.0001,time+Math.max(.1,length));
 osc.connect(amp);amp.connect(bus);osc.start(time);osc.stop(time+Math.max(.12,length)+.07);
}
function audioNotes(){
 const era=g?.era||setup.era,threat=Math.max(g?.threat||0,g?.rivalInfluence||0)*1;
 // Four original 16-step minor sequences; instrument and tempo shift by chosen era.
 let base=era===1975?52:era===2008?50:57;
 const sequences=[[0,3,7,10],[0,5,8,12],[-2,2,5,9],[-5,0,3,7]];
 const serious=[[0,3,7,10],[-2,2,5,9],[-5,0,3,7],[-7,-2,2,5]];
 return {base,notes:threat>65?serious:sequences,tempo:era===1975?82:era===2008?96:102,
  wave:era===1975?'triangle':era===2008?'sine':'triangle',threat};
}
function musicSchedule(){
 const engine=musicEngine;if(!engine.playing||!engine.ctx||engine.ctx.state!=='running')return;
 const ctx=engine.ctx,desc=audioNotes(),seconds=60/desc.tempo/2;
 let safety=0;
 while(engine.nextTime<ctx.currentTime+.20&&safety++<10){
  const step=engine.step,time=engine.nextTime,bar=Math.floor(step/8)%4,beat=step%8;
  const chord=desc.notes[bar],root=desc.base+chord[0];
  if(beat===0){
   musicTone(midiFreq(root-12),time,seconds*6,.30,'sine');
   chord.slice(0,3).forEach((n,i)=>musicTone(midiFreq(desc.base+n),time,seconds*7,.045,i===0?'triangle':'sine'));
  }
  if([0,3,5,7].includes(beat)){
   const order=[0,1,2,1,3,2,1,0];let index=order[beat];
   musicTone(midiFreq(desc.base+12+chord[index]),time,seconds*(desc.threat>68?.82:1.5),desc.threat>68?.085:.064,desc.wave);
  }
  if(desc.threat>52 && [2,6].includes(beat))musicTone(midiFreq(root-24),time,seconds*.28,.12,'sine');
  engine.step++;engine.nextTime+=seconds;
 }
}
async function toggleBgm(){
 const m=musicEngine;
 if(m.playing){
  m.playing=false;if(m.timer){clearInterval(m.timer);m.timer=null}
  if(m.master&&m.ctx){m.master.gain.setTargetAtTime(.0001,m.ctx.currentTime,.04)}
  try{await m.ctx?.suspend()}catch(err){}
  render();return;
 }
 const AudioContextClass=window.AudioContext||window.webkitAudioContext;
 if(!AudioContextClass){alert('현재 브라우저가 배경음악 재생을 지원하지 않습니다.');return}
 try{
  if(!m.ctx){m.ctx=new AudioContextClass();m.master=m.ctx.createGain();m.master.gain.value=.0001;m.master.connect(m.ctx.destination)}
  await m.ctx.resume();m.master.gain.setTargetAtTime(.23,m.ctx.currentTime,.18);
  m.playing=true;m.nextTime=m.ctx.currentTime+.09;m.step=0;
  if(m.timer)clearInterval(m.timer);m.timer=setInterval(musicSchedule,100);musicSchedule();render();
 }catch(err){console.warn('BGM unavailable',err);m.playing=false;alert('이 브라우저에서는 소리를 시작할 수 없습니다.')}
}
document.addEventListener('visibilitychange',()=>{
 let m=musicEngine;if(!m.ctx||!m.playing)return;
 if(document.hidden){m.ctx.suspend().catch(()=>{})}else{
  // Returning to a tab does not request background autoplay if the browser disallows it.
  m.ctx.resume().then(()=>{m.nextTime=m.ctx.currentTime+.12;musicSchedule()}).catch(()=>{})
 }
});

 return `<div class="boss-entry"><div class="tag" style="color:#f4cb8a">1975 시나리오 · 최종장 준비</div><h2>♜ 최고 권력자와의 결전</h2><p>정점의 상대: <b>${esc(target)}</b>. 1978년부터 최종장을 열 수 있습니다. 준비 단계는 1975년부터 시작할 수 있습니다.</p><p>전문가적 계획이 아니라 정치적 세력과 가상의 군부 대치가 맞물리는 드라마형 보스전입니다. 자원이 부족해도 도전은 가능하지만 탈락 위험이 큽니다.</p></div><div class="boss-stage"><div class="tag">INTELLIGENCE / 권력 균형판</div>${boss75Meter('command','군부 신임·무력 대치 대비도')}${boss75Meter('alliance','정치 연합')}${boss75Meter('mandate','공적 명분')}${boss75Meter('restraint','충돌 억제 원칙')}<div class="state-row"><span>상부의 의심 <b>${Math.round(b.heat)}</b></span><span>준비 횟수 <b>${b.preparations}</b></span><span>남은 연 활동 <b>${g.actionLeft}</b></span></div><p class="small muted">준비도는 오르지만 의심도 같이 쌓입니다. 의심이 65를 넘으면 축출 심사에 걸릴 수 있습니다.</p><div class="tag" style="margin:12px 0">올해의 준비 활동 선택</div>${boss75Preparations.map((p,i)=>`<button class="btn opt" ${g.actionLeft<=0?'disabled':''} onclick="boss75Prepare(${i})"><span class="n">${i+1}</span><span class="text"><strong>${esc(p.title)}</strong><span class="desc">${esc(p.desc)}</span></span></button>`).join('')}<div class="boss-hint"><b>승리 조건</b><p>3막에서 2막 이상 유리한 결과를 확보하고, 높은 종합 점수를 획득해야 합니다. 준비 부족과 높은 의심도는 패배 위험을 키웁니다.</p></div><button class="btn primary full" ${g.year<1978?'disabled':''} onclick="boss75Begin()">${g.year<1978?'1978년부터 최종장 도전 가능':'⚠ 최종장 시작 · 승부를 건다'}</button><button class="btn full ghost" onclick="switchTab('power')" style="margin-top:8px">권력 기반으로 돌아가기</button></div>`}
function boss75Prepare(i){if(!g||g.era!==1975||g.boss75.status!=='preparing'||g.actionLeft<=0||g.ended||g.lastChance)return;let b=g.boss75,p=boss75Preparations[i];if(!p)return;g.actionLeft--;g.yearPromptYear=-1;b.preparations++;for(let [k,v] of Object.entries(p.gain))b[k]=lim(b[k]+v);let changes=mod(p.delta);g.threat=lim(g.threat+Math.max(1,Math.round((p.gain.heat||0)/3)));historyNote('최종장 준비 · '+p.title,p.text);if(b.heat>=66&&Math.random()<.18+(b.heat-66)*.011){makeEnding('최종장 도전 기밀 노출',`최고권력이 ${g.name}의 정치적 도전을 확인하고 직위 박탈 절차에 돌입했다.`,'상부의 축출');}if(!g.ended&&!g.lastChance)g.flash={heading:p.text,branch:'최종장 준비 '+b.preparations+'회',changes,auxiliary:true};tab=g.lastChance?'event':'boss';save();render();window.scrollTo(0,0)}
function boss75Begin(){if(!g||g.era!==1975||g.year<1978||g.ended||g.lastChance||g.boss75.status!=='preparing')return;let b=g.boss75;if(!confirm('최종장에 진입합니다. 3막 연속 결정을 내리며 패배하면 축출 위기가 발생합니다. 진행하시겠습니까?'))return;b.target=boss75Target();b.status='fighting';b.step=0;b.score=0;b.losses=0;b.wins=0;g.yearPromptYear=-1;g.flash=null;g.pending=null;g.election=null;g.emergency=null;g.emergencyResult=null;historyNote('1975 최종장 개시',`${g.name}이(가) 최고 권력자 ${b.target}에 대한 가상의 권력 도전을 시작했다.`);tab='boss';save();render();window.scrollTo(0,0)}
function boss75Choose(i){if(!g||g.ended||g.boss75?.status!=='fighting'||g.lastChance)return;let b=g.boss75,r=boss75Rounds[b.step],o=r?.choices[i];if(!o)return;let [a,c]=o.keys;let prep=(b[a]*.47+b[c]*.38)+g.positionScore*.12+g.internalSupport*.08+g.org*.08;let contest=24+b.step*6+b.heat*.13+g.rivalInfluence*.06;let roll=prep-contest+rnd(-15,14);let passed=roll>0;let change=Math.round((passed?13:-8)+(o.gain||0)+rnd(-3,4));b.score=Math.max(0,b.score+change);b.heat=lim(b.heat+o.risk+(passed?-2:8));b.forceUsed=!!(b.forceUsed||o.force);b.choices.push(o.name);if(passed)b.wins++;else b.losses++;if(o.force){mod({legitimacy:-7,trust:-4,opposition:9});g.threat=lim(g.threat+8)}if(i===2)mod({legitimacy:5,stability:4});historyNote(`최종장 제${b.step+1}막 · ${passed?'기회 포착':'상대의 반격'}`,`${o.name} 선택. ${passed?'정치적 우위가 확대됐다.':'권력자의 추종 세력이 반격했다.'}`);b.step++;if(b.step>=3){boss75Finish();return;}save();render();window.scrollTo(0,0)}
function boss75Finish(){let b=g.boss75;let threshold=35+Math.round(b.heat*.12)+Math.round(g.rivalInfluence*.07);let victory=b.wins>=2&&b.score>=threshold;if(victory){b.status='victory';b.completedYear=g.year;g.office='진영 최고 지도자';g.positionScore=93;g.internalSupport=lim(Math.max(61,g.internalSupport));g.leaderTrust=68;g.control=lim(g.control+18);g.rivalInfluence=lim(g.rivalInfluence+12);g.threat=lim(Math.max(34,g.threat));g.regime='가상의 권력 교체 · 신정국';g.branch='1975 최종장 승리';g.decisions.boss75={choice:'최종 권력 경쟁 승리',branch:g.branch,year:g.year,target:b.target,force:b.forceUsed};g.decisions.y79={choice:'최종장 승리로 다른 권력 이양 국면 진입',branch:'대체역사 권력 승계',year:g.year};g.purgeShieldUntil=g.year+1;syncHistoricalPeople();historyNote('1975 시나리오 최종장 클리어',`${g.name}이(가) ${b.target}을(를) 권력의 정점에서 밀어냈다. 무력 대치 ${b.forceUsed?'포함':'회피'}, 향후 민주적 정당성과 국가 안정 책임이 남았다.`);g.flash=null;tab='boss';}else {b.status='failed';historyNote('최종장 패배 · 축출 위기',`${b.target} 측이 정치적 승리 선언을 내렸다. 남은 것은 마지막 구명 절차뿐이다.`);makeEnding('최고 권력자에 대한 도전 실패',`${b.target}의 세력이 권력 경쟁에서 우위를 확보해 ${g.name}을(를) 축출하려 한다.`,'상부의 축출');tab='event'}save();render();window.scrollTo(0,0)}

if(!load()){setup.party=activeFaction().parties[0];setup.region=one(regions(setup.party,1975));drawCareers()}else{ensureNarrative()}render();
</script></body></html>
