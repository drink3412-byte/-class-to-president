// V7: 모두 높은 관계값 대신, 정치 경력을 기반으로 한 가상 인물 관계도.

function npcParty(n,g){return PARTIES[g.era].find(p=>p.people.includes(n))||null}
function npcRelationBaseline(n,g){
 let same=npcParty(n,g)?.name===g.party;
 if(same)return rand(1,100)<=12?rand(35,49):rand(53,76);
 return rand(1,100)<=9?rand(31,45):rand(7,29);
}
function initialRelations(g){return Object.fromEntries([...new Set(PARTIES[g.era].flatMap(x=>x.people))].map(n=>[n,npcRelationBaseline(n,g)]))}
function repairRelations(g){
 if(g.relationModel===7)return;
 // V6 이전 저장: 개인별 사건으로 획득한 점수 변화는 일부 보존하면서 소속에 따라 재보정.
 for(const n of Object.keys(g.relation||{})){
  const same=npcParty(n,g)?.name===g.party;
  const old=Number(g.relation[n]);
  if(!Number.isFinite(old)){g.relation[n]=npcRelationBaseline(n,g);continue}
  g.relation[n]=clamp(Math.round(old+(same?9:-24)),0,100);
 }
 g.relationModel=7;
}

}

function expandedEventCards(g){const jobs={'law':'law','health':'health','biz':'biz','edu':'edu','labor':'labor','youth':'youth'};
 const values={region:g.region,party:g.party,office:g.office,name:g.name,leader:partyData().leader};
 const fill=s=>String(s).replace(/\{(region|party|office|name|leader)\}/g,(_,k)=>values[k]||'');
 return V6_EVENT_BANK.filter(e=>e.tag==='all'||e.tag==='elected'&&g.office!=='정당 신인'||e.tag===jobs[g.track]).map(e=>({id:e.id,title:fill(e.title),topic:e.topic,desc:fill(e.desc),choices:e.choices.map(c=>[fill(c[0]),fill(c[1]),{...c[2]},{...c[3]},fill(c[4]),c[5],c[6],c[7],c[8]])}));
}
function shuffleEventOptions(event){let choices=event.choices.slice();for(let i=choices.length-1;i>0;i--){let j=rand(0,i);[choices[i],choices[j]]=[choices[j],choices[i]]}return {...event,choices};}

function pickEvent(){let g=game,all=eventCards();let recent=(g.seen||[]).slice(-36);let pool=all.filter(x=>!recent.includes(x.id));if(!pool.length)pool=all;let candidates=pool.filter(e=>e.topic!==g.lastTopic);if(candidates.length>5)pool=candidates;let chosen=draw(pool)||all[0];g.lastTopic=chosen.topic;return shuffleEventOptions(chosen)}
function ensureEvent(){if(!game||game.over||game.pending)return;if(!game.currentEvent){game.currentEvent=pickEvent();game.seen.push(game.currentEvent.id);if(game.seen.length>140)game.seen=game.seen.slice(-120);save()}}
function sceneHtml(){let g=game;if(g.campaign)return campaignHtml();if(g.pending)return resultHtml();if(g.over)return endHtml();ensureEvent();let e=g.currentEvent;return `<div class="paper scene"><div class="row between"><span class="eyebrow">${humanDate(g)} / ${g.region}</span><span class="badge">${g.office}</span></div><div class="stage"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div><span class="eventkicker">${safe(e.topic)} · 제${g.turn+1}장</span><h1 class="serif">${safe(e.title)}</h1><p class="eventtext">${safe(e.desc)}</p><div class="hr"></div><div class="eyebrow">YOUR DECISION</div><p class="missionChoice">선택 순서는 사건마다 달라져. 번호가 앞이라고 유리하지 않아.</p>${e.choices.map((c,i)=>`<button class="option" onclick="choose(${i})"><b>0${i+1} · ${safe(c[0])}</b><em>${safe(c[1])}</em></button>`).join('')}<p class="inputhelp">수치는 보정 없는 가상 게임 시뮬레이션이며, 선택 뒤 성공·실패와 예상 밖의 결과가 달라질 수 있습니다.</p></div><div class="paper"><div class="row between"><b class="small">현재 활동 상황</b><span class="tiny muted">정당 ${safe(g.party)}</span></div><div class="metricgrid"><div class="metric"><strong>${g.support}</strong><span>지역 지지도</span></div><div class="metric"><strong>${g.partyTrust}</strong><span>당내 신뢰</span></div><div class="metric"><strong>${g.wealth.toFixed(1)}</strong><span>자산 (억원)</span></div></div></div>`}
function choose(index){if(!game||game.pending||game.over||game.campaign)return;let g=game,e=g.currentEvent,c=e.choices[index];if(!c)return;let before={...g.stats,support:g.support,partyTrust:g.partyTrust,wealth:g.wealth};let chance=clamp((c[5]||70)+((g.stats[c[8]||'policy']||50)-50)*.11,18,96);let win=rand(1,100)<=chance;let mult=win?1:.32;for(let[k,v]of Object.entries(c[2]||{})){if(!(k in g.stats))continue;g.stats[k]=clamp(g.stats[k]+Math.round(v*mult)-(win?0:Math.max(1,Math.ceil(Math.abs(v)/2))))}for(let[k,v]of Object.entries(c[3]||{})){if(k==='support'||k==='partyTrust')g[k]=clamp(g[k]+Math.round(v*mult)-(win?0:1))}if(c[6])g.relation[c[6]]=clamp((g.relation[c[6]]||50)+(win?(c[7]||0):-(c[7]||0)));
 let loss=0;if(!win&&rand(1,100)<40){loss=+.1*rand(1,4);g.wealth=Math.max(0,g.wealth-loss)}
 let afterText=win?c[4]:`시도 과정에서 예상보다 큰 반발과 행정적 문제가 발생했다. ${c[4]} 성과는 일부에 그쳤고, 후속 보완 계획을 세워야 했다.`;
 if(!win){g.stats.trust=clamp(g.stats.trust-1);}
 if(win&&['rent','traffic','school','market'].includes(e.id)){g.promises.push({created:g.year,label:e.title,due:g.turn+rand(3,7),status:'진행 중',impact:rand(1,3)})}
 g.pending={title:e.title,choice:c[0],win,detail:afterText,changes:{...Object.fromEntries(Object.keys(g.stats).map(k=>[k,Math.round(g.stats[k]-before[k])])),support:g.support-before.support,partyTrust:g.partyTrust-before.partyTrust,wealth:+(g.wealth-before.wealth).toFixed(1)}};g.history.unshift({y:g.year,q:g.quarter,t:e.title,d:`${c[0]} · ${afterText}`,win});g.currentEvent=null;mode='outcome';save();render();window.scrollTo(0,0)}
function resultHtml(){let g=game,o=g.pending;return `<div class="paper scene"><div class="eyebrow">DECISION REPORT / ${humanDate(g)}</div><div class="stage"><i class="dot on"></i><i class="dot on"></i><i class="dot"></i></div><span class="tag ${o.win?'':'red'}">${o.win?'진행 성과':'예상 밖의 난관'}</span><h1 class="serif">${safe(o.title)}</h1><p class="lead">당신의 선택 · ${safe(o.choice)}</p><div class="result">${safe(o.detail)}</div><div class="hr"></div><b class="small">이번 사건이 남긴 변화</b><div class="delta" style="margin-top:10px">${Object.entries(o.changes).filter(([k,v])=>v!==0).map(([k,v])=>`<span class="${v<0?'neg':''}">${safe(STATLABEL[k]||{support:'지역 지지도',partyTrust:'당내 신뢰',wealth:'자산'}[k]||k)} ${v>0?'+':''}${v}</span>`).join('')||'<span>능력치 변화 없음 · 정치적 기록 추가</span>'}</div><p class="inputhelp">행동의 결과는 연대기에 기록됩니다. 일부 사건은 몇 분기 뒤 다시 영향을 미칩니다.</p><button class="btn primary full" onclick="nextQuarter()">다음 분기로 진행 →</button></div>`}
function nextQuarter(){if(!game||!game.pending||game.campaign)return;let g=game;g.pending=null;g.turn++;g.quarter++;if(g.quarter>4){g.quarter=1;g.year++;g.age++} // evaluate delayed commitments
 for(let p of g.promises){if(p.status!=='진행 중'||g.turn<p.due)continue;let success=rand(1,100)<clamp(g.stats.org*.6+g.stats.policy*.3+18,15,95);p.status=success?'이행':'지연';g.support=clamp(g.support+(success?p.impact:-p.impact));g.stats.trust=clamp(g.stats.trust+(success?2:-2));g.history.unshift({y:g.year,q:g.quarter,t:`이전 약속의 후속 결과 · ${p.label}`,d:success?'후속 일정과 결과가 공개되어 지역 지지가 소폭 높아졌다.':'약속의 실행이 지연되면서 결과를 설명해야 했다.'});}
 // resources/time
 if(g.turn%4===0){g.wealth=Math.max(0,+(g.wealth+({'youth':.09,law:.28,health:.24,biz:.36,edu:.12,labor:.11}[g.track]||.1)-(g.office==='정당 신인'?.08:.03)).toFixed(2));g.partyTrust=clamp(g.partyTrust+rand(-2,2));}
 // player aging and random news
 if(g.turn%5===0){g.support=clamp(g.support+rand(-3,2));g.history.unshift({y:g.year,q:g.quarter,t:'정치 환경 변화',d:'지역 현안과 유권자 관심사가 달라지면서 정치 활동의 우선순위를 다시 검토하게 되었다.'})}
 if(g.age>=75){g.over=true;g.history.unshift({y:g.year,q:g.quarter,t:'정계 은퇴',d:'오랜 정치 활동을 정리했다.'})}
 mode='event';save();render();window.scrollTo(0,0)}
function endHtml(){let g=game;return `<div class="paper"><div class="ending"><div class="eyebrow" style="color:#c9e4d6">CAREER COMPLETED</div><h1 class="serif">${safe(g.name)}의 정치 연대기</h1><p>${g.won}회 당선 · ${g.lost}회 낙선<br>최종 공직: ${safe(g.office)}</p></div><p class="lead">대통령 당선은 가능한 결말 중 하나일 뿐이며 모든 플레이에서 보장되지 않습니다.</p><button class="btn primary full" onclick="restart()">새 정치 인생 시작</button></div>`}

function electionDue(){let g=game;let y=g.year;let general=g.era===1988?y>=1988&&(y-1988)%4===0:g.era===2008?y>=2008&&(y-2008)%4===0:y>=2028&&(y-2028)%4===0;let local=g.era===1988?y>=1995&&(y-1995)%4===0:g.era===2008?y>=2010&&(y-2010)%4===0:y>=2030&&(y-2030)%4===0;let pres=g.era===1988?y>=1992&&(y-1992)%5===0:g.era===2008?y>=2012&&(y-2012)%5===0:y>=2030&&(y-2030)%5===0;return {general,local,pres}}
const NOMINATION_RULES={
 local:{name:'지방의회',minimum:{org:30,policy:25,partyTrust:32,support:25},score:34,nomination:40,election:58,age:18},
 assembly:{name:'국회의원',minimum:{org:43,policy:40,partyTrust:44,support:39,rep:36},score:49,nomination:52,election:65,age:18},
 president:{name:'대통령',minimum:{org:68,policy:62,partyTrust:66,support:69,rep:70,trust:58,media:57},score:71,nomination:72,election:79,age:40}
};
function electionReadiness(type){let g=game,rule=NOMINATION_RULES[type];let base=Math.round(g.stats.org*.22+g.stats.rep*.28+g.stats.media*.15+g.support*.22+g.partyTrust*.13);
 let nominationScore=Math.round(g.partyTrust*.46+g.stats.org*.27+g.stats.network*.18+g.stats.policy*.09);
 let voteScore=Math.round(g.support*.30+g.stats.rep*.23+g.stats.media*.18+g.stats.trust*.15+g.stats.org*.14);
 let vals={...g.stats,support:g.support,partyTrust:g.partyTrust};
 let items=Object.entries(rule.minimum).map(([key,min])=>({key,name:STATLABEL[key]||{support:'지역 지지도',partyTrust:'당내 신뢰'}[key]||key,value:Math.round(vals[key]||0),min,ok:(vals[key]||0)>=min}));
 let ageMin=type==='president'?40:(g.year<2022?25:18);items.unshift({key:'age',name:'연령',value:g.age,min:ageMin,ok:g.age>=ageMin});
 items.push({key:'readiness',name:'정치적 준비 지표',value:base,min:rule.score,ok:base>=rule.score});
 return {base,margin:rule.score,qualify:items.every(x=>x.ok),items,nominationScore,voteScore,rule};
}

 let attr= o.key==='network'?g.stats.network:(g.stats[o.key]??50);let extra=Math.round((attr-50)/10);
 // 선택 결과가 모두 같지 않도록 능력치 적합도/돌발 변수/행동 비용을 따로 계산.
 let swing=clamp(o.base+extra+rand(-o.risk,o.risk),-15,16);
 let phaseScore=s.phase==='공천'?'nomPoints':'votePoints';c[phaseScore]+=swing;
 let changes={};for(const[k,v]of Object.entries(o.cost||{})){
  if(k in g.stats){g.stats[k]=clamp(g.stats[k]+v);changes[k]=v}
  else if(k==='support'||k==='partyTrust'){g[k]=clamp(g[k]+v);changes[k]=v}
 }
 c.log.push({title:s.title,decision:o.label,swing,phase:s.phase});c.feedback={title:s.title,decision:o.label,swing,changes,detail:swing>=7?'이번 대응은 절차와 논점을 비교적 안정적으로 관리했다.':swing>=0?'일정은 진행됐지만 평가는 엇갈렸다.':'예상치 못한 반발과 실무 문제로 현장 분위기가 흔들렸다.'};
 save();render();window.scrollTo(0,0);
}
function campaignAdvance(){let g=game,c=g?.campaign;if(!c||!c.feedback)return;
 c.feedback=null;
 if(c.stage===2){let rd=electionReadiness(c.type),rel=campaignStrength();let margin=(rd.nominationScore-rd.rule.nomination)*.55+c.nomPoints*.65+rel.helper+rand(-17,17);
 c.nominationWon=margin>=0;c.nomMargin=Math.round(margin);
 if(!c.nominationWon){finishCampaign(false,false);return}
 c.stage=3;
 }else if(c.stage===5){let rd=electionReadiness(c.type);let margin=(rd.voteScore-rd.rule.election)*.62+c.votePoints*.65+rand(-20,20);
 c.voteMargin=Math.round(margin);finishCampaign(true,margin>=0);return;
 }else c.stage++;
 save();render();window.scrollTo(0,0);
}
function finishCampaign(nominated,elected){let g=game,c=g.campaign,office=c.type==='president'?'대통령':c.type==='assembly'?'국회의원':'지방의회의원';
 let ratio=clamp(Math.round(50+(nominated?c.voteMargin:c.nomMargin)*.32),28,72),changes={};
 if(!nominated){g.partyTrust=clamp(g.partyTrust-3);g.lost++;changes.partyTrust=-3}
 else if(elected){g.office=office;g.won++;g.support=clamp(g.support+8);g.partyTrust=clamp(g.partyTrust+5);g.stats.media=clamp(g.stats.media+4);changes={support:8,partyTrust:5,media:4};if(office==='대통령')g.over=true}
 else{g.lost++;g.support=clamp(g.support-5);g.partyTrust=clamp(g.partyTrust-2);changes={support:-5,partyTrust:-2}}
 let detail=!nominated?`${g.party}의 가상 공천 경선에서 최종 후보로 선출되지 못했다. 이번 경선 과정에서 제출한 정책과 지역 활동은 정치 기록으로 남았다.`:elected?`가상 개표가 마무리됐다. 당신은 ${office} 선거에서 당선됐다. 이제 선거에서 약속한 계획을 현실적인 행정·입법 절차로 옮겨야 한다.`:`가상 개표 결과 상대 후보가 더 많은 표를 얻었다. ${office} 선거에 낙선했지만 지역 조직과 정치 활동은 남아 있다.`;
 let title= !nominated?'공천 경선 탈락':elected?`${office} 당선`:'본선 선거 낙선';
 let gamesummary=nominated?`게임 속 가상 득표 비중 ${ratio}% (상대 ${100-ratio}%)`:`게임 속 가상 경선 지표 ${ratio} / 상대 ${100-ratio}`;
 g.history.unshift({y:g.year,q:g.quarter,t:`${office} 도전 · ${title}`,d:`${detail} ${gamesummary} · ${c.log.map(x=>x.title+' / '+x.decision).join(' → ')}`});
 g.pending={title,choice:`공천·선거 미니게임 ${c.log.length}단계 진행`,win:nominated&&elected,detail:`${detail} ${gamesummary}. ※ 실제 선거 결과나 여론조사와 무관한 게임 내 가상 수치야.`,changes};
 g.campaign=null;mode='outcome';screen='event';save();render();window.scrollTo(0,0);
}
function campaignHtml(){let g=game,c=g.campaign,s=CAMPAIGN_STAGES[c.stage],n=c.stage+1;
 let indicator=s.phase==='공천'?c.nomPoints:c.votePoints;
 return `<div class="paper campaignScene"><div class="eyebrow">ELECTION SPECIAL · ${safe(g.year)} / ${safe(g.region)}</div><div class="row between"><span class="tag">${s.phase==='공천'?'당내 공천 경선':'본선 선거'}</span><span class="badge">${n} / 6 단계</span></div><h1 class="serif">${safe(s.title)}</h1><div class="campaignSteps">${CAMPAIGN_STAGES.map((x,i)=>`<span class="${i<c.stage?'done':i===c.stage?'now':''}"></span>`).join('')}</div><p class="eventtext">${safe(s.desc)}</p><div class="campaignBox"><span>${s.phase==='공천'?'당내 경선 활동 성과':'본선 선거 활동 성과'}</span><strong class="${indicator<0?'negative':''}">${indicator>=0?'+':''}${indicator}</strong><small>게임 내 행동으로 누적되는 가상 지표 · 실제 선거 예측 아님</small></div>${c.feedback?`<div class="campaignFeedback"><div class="eyebrow">결정의 결과</div><h2 class="serif">${safe(c.feedback.decision)}</h2><p class="lead">${safe(c.feedback.detail)}</p><div class="delta"><span class="${c.feedback.swing<0?'neg':''}">선거 활동 성과 ${c.feedback.swing>=0?'+':''}${c.feedback.swing}</span>${Object.entries(c.feedback.changes).map(([k,v])=>`<span class="${v<0?'neg':''}">${safe(STATLABEL[k]||{support:'지역 지지도',partyTrust:'당내 신뢰'}[k]||k)} ${v>0?'+':''}${v}</span>`).join('')}</div></div><button class="btn primary full" onclick="campaignAdvance()">${c.stage===2?'가상 공천 결과 공개 →':c.stage===5?'가상 개표 결과 공개 →':'다음 선거 장면 →'}</button>`:`<div class="eyebrow">CAMPAIGN DECISION · 선택지를 골라 진행</div>${s.options.map((o,i)=>`<button class="option" onclick="campaignAction(${i})"><b>0${i+1} · ${safe(o.label)}</b><em>${safe(o.sub)}</em></button>`).join('')}`}<p class="inputhelp">실존 정치인 이름과 정당은 배경 설정이며, 경선·유권자 반응·가상 득표는 모두 실제 기록과 무관한 창작입니다.</p></div>`
}
function politicsHtml(){if(game.campaign)return campaignHtml();let g=game,d=electionDue(),p=partyData();return `<div class="paper"><div class="eyebrow">PARTY & ELECTORAL SYSTEM</div><h2 class="serif">공천 준비 상황</h2><div class="notice"><b>${safe(g.party)}</b> 소속 · ${safe(g.region)}<br>각 선거의 최소 능력치를 충족해야 게임 속 공천 심사를 신청할 수 있어. 충족 뒤에도 실제 선출 여부는 공천·본선 판정을 별도로 거쳐.</div><div class="metricgrid" style="margin-top:10px"><div class="metric"><strong>${g.support}</strong><span>지역 지지도</span></div><div class="metric"><strong>${g.partyTrust}</strong><span>당내 신뢰</span></div><div class="metric"><strong>${g.won}</strong><span>선출직 당선</span></div></div><h2 class="serif" style="font-size:19px;margin-top:25px">선거별 최소 요구치</h2><p class="lead">실제 후보 등록 자격과 별개로, 능력치 조건은 게임 난이도를 위한 가상 규칙이야. 선거 일정도 게임용으로 단순화했어.</p>${[['local','지방의회 도전',d.local],['assembly','국회의원 도전',d.general],['president','대통령 도전',d.pres]].map(([type,title,due])=>{let r=electionReadiness(type),missing=r.items.filter(x=>!x.ok).length,attempted=g.electionLast===g.year;return `<details ${type==='local'||due?'open':''}><summary>${title} · ${due?'선거 연도':'다음 '+nextElectionYear(type)+'년'} · ${r.qualify?'조건 달성':'부족 '+missing+'개'}</summary>${nominationChecklist(type)}<div class="chiprow"><span>공천 심사 지표 ${r.nominationScore} / 기준 ${r.rule.nomination}</span><span>본선 경쟁력 지표 ${r.voteScore} / 참고 ${r.rule.election}</span></div><p class="reqfoot">공천은 3단계, 본선은 3단계의 미니게임으로 진행돼. 준비 지표와 선택, 돌발 변수가 종합 반영되며 실제 선거를 예측하지 않아.</p><button class="btn ${due&&r.qualify&&!attempted?'primary':'subtle'} full" ${due&&r.qualify&&!attempted?'':'disabled'} onclick="tryNomination('${type}')">${!due?'선거 연도 대기':attempted?'올해 이미 선거에 도전함':r.qualify?'공천 경선 미니게임 시작':'최소 요구치 충족 필요'}</button></details>`}).join('')}<p class="source">현실의 법정 요건과 게임 능력치 요건은 다릅니다. 실존 정당과 인물을 배경으로 한 대체 역사이며 공천 결과, 유권자 투표, 인물 관계는 창작입니다.</p></div>`}
function timelineHtml(){let g=game;return `<div class="paper"><div class="eyebrow">CHRONICLE</div><h2 class="serif">${safe(g.name)}의 연대기</h2><p class="lead">출신: ${safe(g.career)} · ${safe(g.backstory)}<br>활동 지역: ${safe(g.region)} · 소속: ${safe(g.party)}</p>${g.history.map(h=>`<div class="timelineitem"><span class="eyebrow">${h.y}년 ${h.q||''}분기</span><br><b>${safe(h.t)}</b><p>${safe(h.d)}</p></div>`).join('')}</div><div class="paper"><h2 class="serif" style="font-size:18px">이행 추적 중인 약속</h2>${g.promises.length?g.promises.slice(-12).reverse().map(x=>`<div class="listitem"><b>${safe(x.label)}</b> · ${safe(x.status)}<br><span class="muted tiny">제안: ${x.created}년</span></div>`).join(''):'<p class="lead">기록된 약속이 없어.</p>'}</div>`}
function moreHtml(){let g=game;return `<div class="paper"><div class="eyebrow">PROFILE & DATA</div><h2 class="serif">${safe(g.name)}의 능력치</h2>${statHtml()}<div class="hr"></div><p class="lead">정계 입문 경로: ${safe(g.backstory)}<br>현재 나이: ${g.age}세 · 자산: ${g.wealth.toFixed(2)}억 원</p><button class="btn subtle full" onclick="exportSave()">저장 데이터 파일로 내보내기</button><label class="label">저장 파일 불러오기</label><input type="file" class="field" accept="application/json,.json" onchange="importSave(this)"><div class="hr"></div><button class="btn warn full" onclick="restart()">인생 초기화하고 다시 시작</button><details><summary>역사적 사실과 게임 창작의 구분</summary><p class="lead">정당과 이름 있는 NPC는 실존 인물·정당의 출발 시점 정보를 참고했어. 게임의 개별 사건, 공천, 선거 결과, 사람 사이의 가상 관계 수치는 사실 관계와 무관한 창작 시뮬레이션이야. 2026년 주요 인물과 직함은 2026-10-27 공개 일정 기준이야.</p><p class="source"><a target="_blank" rel="noopener" href="https://www.theminjoo.kr/">더불어민주당 공식 사이트</a> · <a target="_blank" rel="noopener" href="https://www.peoplepowerparty.kr/">국민의힘 공식 사이트</a> · <a target="_blank" rel="noopener" href="https://www.nec.go.kr/">중앙선거관리위원회</a></p></details></div>`}
function exportSave(){let data=JSON.stringify(game,null,2),b=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='political-life-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importSave(el){let file=el.files[0];if(!file)return;try{let s=JSON.parse(await file.text());if(s.v!==1||!s.stats||!s.party||!s.year)throw new Error('잘못된 데이터');game=s;game.campaign??=null;repairRelations(game);mode=s.pending?'outcome':'event';screen=game.campaign?'politics':'event';save();render()}catch(e){alert('올바른 저장 파일이 아니야.')} }
function restart(){if(!confirm('현재 게임을 초기화할까? 이 진행 데이터는 삭제돼.'))return;try{localStorage.removeItem(KEY)}catch(e){}freshStart()}
function render(){let target=$('app');if(!target)return;if(!game){target.innerHTML=setupHtml();return}target.innerHTML=head()+`<main class="page">${({event:sceneHtml,people:contactsHtml,politics:politicsHtml,record:timelineHtml,more:moreHtml}[screen]||sceneHtml)()}</main>`+nav()}
main();
</script></body></html>
