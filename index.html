function relations(s){let obj={};scens[s.era].people.forEach(([n,p],i)=>{let aligned=p===s.party;if(p==='군부'&&s.faction==='newguard')aligned=true;if(s.faction==='yushin'&&p==='민주공화당')aligned=true;if(s.faction==='reform'&&p==='신민당')aligned=true;obj[n]={p,score:aligned?rnd(49,74):rnd(12,42),faction:aligned?'협력 가능':'다른 세력'}});return obj}

function mod(delta){let changed=[];for(let [k,v] of Object.entries(delta||{})){if(typeof g[k]!=='number')continue;let prev=g[k],next=prev+v;if(['wealth','partyFunds'].includes(k))next=Math.max(0,next);else next=lim(next);g[k]=next;if(prev!==next)changed.push({key:k,delta:next-prev})}return changed}

const rounds=[{title:'후보 선출을 위한 공개 논의',intro:'정당 내부의 경쟁자들과 입장을 설명할 기회다.',opts:[['공개 정책 토론에 집중', 'policy',6],['지역 조직을 결집','org',7],['다른 세력과 협의', 'network',6]]},{title:'공천 심사 최종 단계',intro:'지도부와 유권자의 판단이 엇갈리고 있다.',opts:[['정책 성과 공개','policy',7],['당내 합의와 절차 강조','trust',8],['지역 일정에 집중','support',7]]},{title:'본선 공개 토론',intro:'최종 후보와 정책을 비교하는 방송이 진행된다.',opts:[['국가정책 비전 제시','policy',8],['지역 유권자 문제 집중','support',8],['정치적 협력 능력 강조','network',8]]},{title:'투표일 전 마지막 일정',intro:'당선 여부는 아직 알 수 없다.',opts:[['공개 지지 행사','media',7],['정당 조직 정비','org',7],['공식 정책자료 발표','trust',8]]}];
function startElection(type){if(g.election||g.flash)return;let r=requirements().find(x=>x.type===type);if(!r||!Object.entries(r.rules).every(([k,v])=>g[k]>=v)||g.partyFunds<r.fund)return;g.partyFunds-=r.fund;g.election={type,step:0,score:0,nomDone:false,done:false,progress:0,ours:50,theirs:50,final:50};tab='election';save();render()}
function campaignPage(){let e=g.election;if(!e)return reqPage();if(e.step<4){let r=rounds[e.step];return `<div class="row between"><span class="tag">${e.step<2?'공천 경선':'본선 선거'}</span><span class="pill">${e.step+1} / 4</span></div><div class="hero"><h2>${r.title}</h2><p class="lede">${r.intro}</p></div><div class="card"><div class="tag">이번 장면에서의 대응</div>${r.opts.map((o,i)=>`<button class="btn opt" onclick="campaignChoice(${i})"><span class="n">0${i+1}</span><span class="text"><strong>${o[0]}</strong><span class="desc">${statLabels[o[1]]} 능력치가 반영됩니다.</span></span></button>`).join('')}</div><div class="card"><div class="label">현재 준비 상태</div><div class="row between"><strong>${esc(g.party)}</strong><strong>${g.support} / 100</strong></div><div class="bar"><i style="width:${g.support}%"></i></div><p class="small muted">가상 정치 시뮬레이션이며 실제 선거 예측이 아닙니다.</p></div>`}return electionBroadcast()}
function campaignChoice(i){let e=g.election;if(!e||e.step>=4)return;let r=rounds[e.step],o=r.opts[i],stat=g[o[1]],bonus=(stat-35)/8 +o[2]+rnd(-5,5);e.score+=bonus;if(e.step===1){let val=(g.org*.25+g.network*.21+g.trust*.18+g.support*.2+e.score*1.3);if(val<28){g.internalSupport=lim(g.internalSupport-13);g.history.unshift({y:g.year,title:'공천 경선 탈락',desc:'당내 후보 선출 과정에서 경쟁에 패했다.'});g.flash={heading:'공천 경선에서 탈락했다.',branch:'',changes:[]};g.election=null;tab='event';save();render();return}e.nomDone=true}e.step++;if(e.step>=4){let base=(g.org*.17+g.policy*.12+g.support*.28+g.network*.10+g.media*.08+g.trust*.11+g.parliament*.04)+(e.score*.32);let final=lim(37+(base-35)*.25+rnd(-11,11),22,78);e.final=Math.round(final*10)/10;e.progress=0;e.ours=50;e.theirs=50;}save();render();if(e.step>=4)beginCount()}
function electionBroadcast(){let e=g.election;return `<div class="tag">ELECTION NIGHT · LIVE COUNT</div><h2 class="title" style="font-size:24px">${e.type==='president'?'대통령 선거':e.type==='leader'?'정당 대표 경선':'국회의원 선거'} 개표 중계</h2><div class="card"><div class="row between"><strong>${esc(g.name)}</strong><span class="badge">가상 집계</span></div><div class="countup" id="countLabel">개표 ${Math.round(e.progress)}%</div><div class="score"><div><small>플레이어</small><strong id="ourScore">${e.ours.toFixed(1)}%</strong></div><div style="text-align:right"><small>상대 후보</small><strong id="theirScore">${e.theirs.toFixed(1)}%</strong></div></div><div class="vote"><i class="ours" id="voteBar" style="width:${e.ours}%"></i><i class="theirs"></i></div><div class="bar" style="height:4px"><i id="countBar" style="width:${e.progress}%"></i></div><p class="small muted" style="margin-top:12px">실제 정치인·유권자의 득표를 예측하는 결과가 아닌 게임 속 가상 방송 연출입니다.</p></div><button class="btn primary full" id="finishCount" ${e.progress<100?'disabled':''} onclick="finishElection()">최종 결과 확인 →</button>${e.progress<100?'<button class="btn full ghost" onclick="skipCount()" style="margin-top:7px">개표 완료까지 건너뛰기</button>':''}`}
function beginCount(){if(revealTimer)clearInterval(revealTimer);if(!g?.election||g.election.step<4||g.election.progress>=100)return;revealTimer=setInterval(()=>{let e=g?.election;if(!e||e.step<4||e.progress>=100){clearInterval(revealTimer);revealTimer=null;return}e.progress=Math.min(100,e.progress+4);let noise=(1-e.progress/100)*(Math.sin(e.progress*.62)*9+rnd(-3,3));let p=lim(50+(e.final-50)*e.progress/100+noise,8,92);if(e.progress===100)p=e.final;e.ours=Math.round(p*10)/10;e.theirs=Math.round((100-p)*10)/10;for(let [id,t] of [['countLabel','개표 '+e.progress+'%'],['ourScore',e.ours.toFixed(1)+'%'],['theirScore',e.theirs.toFixed(1)+'%']]){let el=$(id);if(el)el.textContent=t}if($('voteBar'))$('voteBar').style.width=e.ours+'%';if($('countBar'))$('countBar').style.width=e.progress+'%';if(e.progress===100){clearInterval(revealTimer);revealTimer=null;save();render()}},130)}
function skipCount(){if(!g?.election)return;if(revealTimer)clearInterval(revealTimer);revealTimer=null;let e=g.election;e.progress=100;e.ours=e.final;e.theirs=Math.round((100-e.final)*10)/10;save();render()}
function finishElection(){let e=g.election;if(!e||e.progress<100)return;let won=e.final>50,office={assembly:'국회의원',leader:'정당 대표',president:'대통령'}[e.type];let old=g.office;if(won){g.office=office;g.won++;g.control=lim(g.control+(e.type==='president'?27:e.type==='leader'?15:6));g.parliament=lim(g.parliament+(e.type==='assembly'?19:e.type==='president'?12:7));g.support=lim(g.support+8);g.phase=office==='대통령'?'국정 운영':office==='국회의원'?'입법 활동':'당권 운영';g.term=0}else{g.support=lim(g.support-7);g.org=lim(g.org+4)}g.history.unshift({y:g.year,title:won?office+' 당선':office+' 도전 실패',desc:`가상 개표 ${e.final.toFixed(1)}% : ${(100-e.final).toFixed(1)}%. ${won?`정치적 지위가 ${old}에서 ${office}(으)로 변경됐다.`:'경쟁에서 패배했지만 조직은 남았다.'}`});g.election=null;g.flash={heading:won?office+'에 당선되었습니다.':'선거에서 패배했습니다.',branch:won?'권력 구조 변화':'',changes:[{key:'support',delta:won?8:-7}],auxiliary:true};tab='event';save();render()}
function historyPage(){return `<div class="tag">CHANGED HISTORY</div><h2 class="title">당신이 바꾼 대한민국</h2><div class="card"><div class="label">지금의 국가적 흐름</div><h3 style="margin:8px 0;font-size:20px">${esc(g.branch)}</h3><p class="small muted">선택한 과거는 되돌아가지 않습니다. 역사적 사건의 전개는 현재의 국가 질서에 영향을 받습니다.</p></div><div class="history">${g.history.map(x=>`<article><span class="tag">${x.y}년</span><strong>${esc(x.title)}</strong><p>${esc(x.desc)}</p></article>`).join('')}</div>`}
function morePage(){return `<div class="tag">SAVE & CONTROL</div><h2 class="title">게임 정보</h2><div class="card"><div class="label">현재 게임</div><p>${esc(g.name)} · ${g.age}세 · ${esc(g.career)} · ${esc(g.office)}</p><p class="small muted">${g.era}년 시작 → ${g.year}년 현재 · ${esc(g.branch)}</p><button class="btn full" onclick="save();alert('이 브라우저에 저장되었습니다.')">현재 진행 저장</button><button class="btn ghost full" style="margin-top:8px" onclick="resetGame()">새로운 역사 시작</button></div><details><summary>기획과 사실·허구 구분</summary><p>1975년 긴급조치 9호, 1979년 10·26과 12·12, 2008년 금융위기 등 역사적 배경은 실제 사건에 기초합니다. 플레이어의 개입, 이후 선거와 인물 관계는 모두 가상입니다.</p><p>역사적 권력행사와 강제 진압의 정치적 선택은 등장하나 실행을 위한 세부 지침은 포함하지 않습니다.</p></details><div class="small muted">대한민국: 권력의 역사 · V13 연속 권력투쟁·복선·다중 엔딩 리부트<br>게임용 모델이며 정치인·정당의 실제 평가나 선거 전망을 의미하지 않습니다.</div>`}
function resetGame(){if(!confirm('새 게임을 시작하시겠습니까? 현재 저장은 초기화됩니다.'))return;if(revealTimer)clearInterval(revealTimer);g=null;setup.era=1975;setup.faction='newguard';setup.party=activeFaction().parties[0];setup.region=one(regions(setup.party,setup.era));drawCareers();localStorage.removeItem(SAVE);render()}
function nav(){return `<nav class="nav">${[['event','▣','사건'],['world','◈','대한민국'],['power','◉','권력'],['election','▥','선거'],['history','▤','역사'],['more','⚙','설정']].map(([x,icon,n])=>`<button class="${tab===x?'on':''}" onclick="switchTab('${x}')"><span class="ico">${icon}</span>${n}</button>`).join('')}</nav>`}
function switchTab(x){if(g?.election&&x==='election'){}tab=x;save();render();window.scrollTo(0,0)}
function render(){document.body.dataset.era=String(g?.era||setup.era);const app=$('app');if(!g){app.innerHTML=setupPage();return}let view={event:eventPage,world:worldPage,power:powerPage,election:()=>g.election?campaignPage():reqPage(),history:historyPage,more:morePage};app.innerHTML=header()+`<main class="page">${(view[tab]||eventPage)()}</main>`+nav()+urgentOverlay();if(g.election&&g.election.step>=4&&g.election.progress<100&&tab==='election'&&!revealTimer)beginCount()}
if(!load()){setup.party=activeFaction().parties[0];setup.region=one(regions(setup.party,1975));drawCareers()}else{ensureNarrative()}render();
</script></body></html>
