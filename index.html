function expandedEventCards(g){const jobs={'law':'law','health':'health','biz':'biz','edu':'edu','labor':'labor','youth':'youth'};
 const values={region:g.region,party:g.party,office:g.office,name:g.name,leader:partyData().leader};
 const fill=s=>String(s).replace(/\{(region|party|office|name|leader)\}/g,(_,k)=>values[k]||'');
 return V6_EVENT_BANK.filter(e=>e.tag==='all'||e.tag==='elected'&&g.office!=='정당 신인'||e.tag===jobs[g.track]).map(e=>({id:e.id,title:fill(e.title),topic:e.topic,desc:fill(e.desc),choices:e.choices.map(c=>[fill(c[0]),fill(c[1]),{...c[2]},{...c[3]},fill(c[4]),c[5],c[6],c[7],c[8]])}));
}
function shuffleEventOptions(event){let choices=event.choices.slice();for(let i=choices.length-1;i>0;i--){let j=rand(0,i);[choices[i],choices[j]]=[choices[j],choices[i]]}return {...event,choices};}

[2000,2003,'고속철도 개통 준비와 역세권 갈등','고속철도 개통 준비가 진행되는 가운데 지역 상인들은 역세권 개발에 기대를 걸고, 기존 상권 주민들은 유동 인구 변화가 걱정된다고 말한다.',

[2002,2004,'온라인 시민 참여의 초기 확산','인터넷 게시판과 이메일을 활용한 지역 정치 참여가 늘고 있다. 지역조직이 온라인 의견 수렴을 시도하자 익명 의견과 실제 주민 의견을 어떻게 구분할지 논쟁이 생겼다.',

function liveShare(b){let p=b.progress/100;return clamp(b.finalShare+(1-p)*(Math.sin(p*13+b.seed)*6+(b.seed*.5)),15,85)}
function broadcastHtml(){let b=game.broadcast,share=liveShare(b),label=b.kind==='nomination'?'당내 공천 경선':'본선 선거';let progress=Math.round(b.progress),v=share.toFixed(1);
 return `<div class="paper scene"><div class="eraRibbon"><b>${game.era===1988?'紙面 特報':game.era===2008?'선거 인터넷 생중계':'선거 데이터 센터'}</b><span>가상 정치사</span></div><div class="votePanel"><div class="broadcastTop"><span class="breaking">${b.done?'FINAL RESULT':'LIVE COUNT'}</span><h1 class="serif">${label} · 개표 중계</h1><p class="lead">${safe(game.year)}년 · ${safe(game.region)}<br>게임 속에서 만든 가상 득표 집계입니다.</p></div><div class="row between"><span class="small bold">개표 진행률</span><b id="countProgressText">${progress}%</b></div><div class="countProgress"><i id="countProgressBar" style="width:${progress}%"></i></div><div class="voteRow"><b>${safe(game.name)}</b><strong id="voteMineText">${v}%</strong></div><div class="voteBar"><i id="voteMineBar" style="width:${v}%"></i></div><div class="voteRow" style="margin-top:17px"><b>${b.kind==='nomination'?'다른 경선 후보':'상대 진영 후보'}</b><strong id="voteOtherText">${(100-share).toFixed(1)}%</strong></div><div class="voteBar rival"><i id="voteOtherBar" style="width:${(100-share).toFixed(1)}%"></i></div><div class="broadcastTicker" id="countTicker">${b.done?'집계가 완료되었습니다. 최종 결과를 확인하세요.':'지역별 가상 개표가 진행 중입니다. 득표율은 계속 변합니다.'}</div><button id="countFinish" class="btn primary full finishBtn" ${b.done?'':'disabled'} onclick="finishCount()">${b.done?'최종 결과 발표 →':'개표 진행 중…'}</button><button class="btn subtle full" onclick="skipCount()" style="margin-top:8px" ${b.done?'disabled':''}>연출 건너뛰기</button></div><p class="source">표시된 수치는 게임용 무작위 시뮬레이션입니다. 실제 선거, 여론조사, 실존 후보자의 당락과 무관합니다.</p></div>`;
}
function updateCountUI(){let b=game?.broadcast;if(!b)return;let share=liveShare(b),v=share.toFixed(1),other=(100-share).toFixed(1);for(let [id,t]of [['countProgressText',Math.round(b.progress)+'%'],['voteMineText',v+'%'],['voteOtherText',other+'%']]){let el=$(id);if(el)el.textContent=t}
 for(let[id,w]of [['countProgressBar',b.progress],['voteMineBar',share],['voteOtherBar',100-share]]){let el=$(id);if(el)el.style.width=w+'%'}
 let line=$('countTicker');if(line)line.textContent=b.done?'집계 완료. 최종 결과 발표가 준비됐습니다.':b.progress<35?'초반 개표: 일부 지역의 집계 결과가 먼저 반영됩니다.':b.progress<75?'중반 개표: 뒤집히는 구간이 나타날 수 있습니다.':'막판 개표: 최종 수치에 가까워지고 있습니다.';
 let btn=$('countFinish');if(btn){btn.disabled=!b.done;btn.textContent=b.done?'최종 결과 발표 →':'개표 진행 중…'}
}
function playCount(){if(!game?.broadcast||game.broadcast.done||activeCountTimer)return;
 activeCountTimer=setInterval(()=>{let b=game?.broadcast;if(!b){clearInterval(activeCountTimer);activeCountTimer=null;return}b.progress=Math.min(100,b.progress+rand(2,6));if(b.progress>=100){b.done=true;clearInterval(activeCountTimer);activeCountTimer=null;save()}updateCountUI()},125);
}
function skipCount(){if(!game?.broadcast)return;if(activeCountTimer){clearInterval(activeCountTimer);activeCountTimer=null}game.broadcast.progress=100;game.broadcast.done=true;save();updateCountUI()}
function finishCount(){let b=game?.broadcast;if(!b?.done)return;game.broadcast=null;if(b.kind==='nomination'){
 if(!b.won){finishCampaign(false,false);return}game.campaign.stage=3;save();render();window.scrollTo(0,0);
 }else finishCampaign(true,b.won);
}

function campaignAdvance(){let g=game,c=g?.campaign;if(!c||!c.feedback)return;
 c.feedback=null;
 if(c.stage===2){let rd=electionReadiness(c.type),rel=campaignStrength();let margin=(rd.nominationScore-rd.rule.nomination)*.55+c.nomPoints*.65+rel.helper+rand(-17,17);
 c.nominationWon=margin>=0;c.nomMargin=Math.round(margin);
 launchCount('nomination',c.nominationWon);return;
 }else if(c.stage===5){let rd=electionReadiness(c.type);let margin=(rd.voteScore-rd.rule.election)*.62+c.votePoints*.65+rand(-20,20);
 c.voteMargin=Math.round(margin);launchCount('election',margin>=0);return;
 }else c.stage++;
 save();render();window.scrollTo(0,0);
}
function finishCampaign(nominated,elected){let g=game,c=g.campaign,office=c.type==='president'?'대통령':c.type==='assembly'?'국회의원':'지방의회의원';
 let ratio=clamp(Math.round(50+(nominated?c.voteMargin:c.nomMargin)*.32),28,72),changes={};
 if(!nominated){g.partyTrust=clamp(g.partyTrust-3);g.lost++;changes.partyTrust=-3}
 else if(elected){g.office=office;g.won++;g.support=clamp(g.support+8);g.partyTrust=clamp(g.partyTrust+5);g.stats.media=clamp(g.stats.media+4);changes={support:8,partyTrust:5,media:4};if(office==='대통령'){g.presidencyEndYear=g.year+5;g.presidentialTerms=(g.presidentialTerms||0)+1}}
 else{g.lost++;g.support=clamp(g.support-5);g.partyTrust=clamp(g.partyTrust-2);changes={support:-5,partyTrust:-2}}
 let detail=!nominated?`${g.party}의 가상 공천 경선에서 최종 후보로 선출되지 못했다. 이번 경선 과정에서 제출한 정책과 지역 활동은 정치 기록으로 남았다.`:elected?`가상 개표가 마무리됐다. 당신은 ${office} 선거에서 당선됐다. 이제 선거에서 약속한 계획을 현실적인 행정·입법 절차로 옮겨야 한다.`:`가상 개표 결과 상대 후보가 더 많은 표를 얻었다. ${office} 선거에 낙선했지만 지역 조직과 정치 활동은 남아 있다.`;
 let title= !nominated?'공천 경선 탈락':elected?`${office} 당선`:'본선 선거 낙선';
 let gamesummary=nominated?`게임 속 가상 득표 비중 ${ratio}% (상대 ${100-ratio}%)`:`게임 속 가상 경선 지표 ${ratio} / 상대 ${100-ratio}`;
 g.history.unshift({y:g.year,q:g.quarter,t:`${office} 도전 · ${title}`,d:`${detail} ${gamesummary} · ${c.log.map(x=>x.title+' / '+x.decision).join(' → ')}`});
 g.pending={title,milestone:!!elected,choice:`공천·선거 절차 ${c.log.length}단계 진행`,win:nominated&&elected,detail:`${detail} ${gamesummary}. ※ 실제 선거 결과나 여론조사와 무관한 게임 내 가상 수치야.`,changes};
 g.campaign=null;mode='outcome';screen='event';save();render();window.scrollTo(0,0);
}
function campaignHtml(){if(game.broadcast)return broadcastHtml();let g=game,c=g.campaign,s=CAMPAIGN_STAGES[c.stage],n=c.stage+1;
 let indicator=s.phase==='공천'?c.nomPoints:c.votePoints;
 return `<div class="paper campaignScene"><div class="eyebrow">ELECTION SPECIAL · ${safe(g.year)} / ${safe(g.region)}</div><div class="row between"><span class="tag">${s.phase==='공천'?'당내 공천 경선':'본선 선거'}</span><span class="badge">${n} / 6 단계</span></div><h1 class="serif">${safe(s.title)}</h1><div class="campaignSteps">${CAMPAIGN_STAGES.map((x,i)=>`<span class="${i<c.stage?'done':i===c.stage?'now':''}"></span>`).join('')}</div><p class="eventtext">${safe(s.desc)}</p><div class="campaignBox"><span>${s.phase==='공천'?'당내 경선 활동 성과':'본선 선거 활동 성과'}</span><strong class="${indicator<0?'negative':''}">${indicator>=0?'+':''}${indicator}</strong><small>게임 내 행동으로 누적되는 가상 지표 · 실제 선거 예측 아님</small></div>${c.feedback?`<div class="campaignFeedback"><div class="eyebrow">결정의 결과</div><h2 class="serif">${safe(c.feedback.decision)}</h2><p class="lead">${safe(c.feedback.detail)}</p><div class="delta"><span class="${c.feedback.swing<0?'neg':''}">선거 활동 성과 ${c.feedback.swing>=0?'+':''}${c.feedback.swing}</span>${Object.entries(c.feedback.changes).map(([k,v])=>`<span class="${v<0?'neg':''}">${safe(STATLABEL[k]||{support:'지역 지지도',partyTrust:'당내 신뢰'}[k]||k)} ${v>0?'+':''}${v}</span>`).join('')}</div></div><button class="btn primary full" onclick="campaignAdvance()">${c.stage===2?'가상 공천 결과 공개 →':c.stage===5?'가상 개표 결과 공개 →':'다음 선거 장면 →'}</button>`:`<div class="eyebrow">CAMPAIGN DECISION · 선택지를 골라 진행</div>${s.options.map((o,i)=>`<button class="option" onclick="campaignAction(${i})"><b>0${i+1} · ${safe(o.label)}</b><em>${safe(o.sub)}</em></button>`).join('')}`}<p class="inputhelp">실존 정치인 이름과 정당은 배경 설정이며, 경선·유권자 반응·가상 득표는 모두 실제 기록과 무관한 창작입니다.</p></div>`
}
function politicsHtml(){if(game.broadcast)return broadcastHtml();if(game.campaign)return campaignHtml();let g=game,d=electionDue(),p=partyData();return `<div class="paper"><div class="eyebrow">PARTY & ELECTORAL SYSTEM</div><h2 class="serif">공천 준비 상황</h2><div class="notice"><b>${safe(g.party)}</b> 소속 · ${safe(g.region)}<br>각 선거의 최소 능력치를 충족해야 게임 속 공천 심사를 신청할 수 있어. 충족 뒤에도 실제 선출 여부는 공천·본선 판정을 별도로 거쳐.</div><div class="metricgrid" style="margin-top:10px"><div class="metric"><strong>${g.support}</strong><span>${g.office==='대통령'?'국정 지지도':'지역 지지도'}</span></div><div class="metric"><strong>${g.partyTrust}</strong><span>당내 신뢰</span></div><div class="metric"><strong>${g.won}</strong><span>선출직 당선</span></div></div><h2 class="serif" style="font-size:19px;margin-top:25px">선거별 최소 요구치</h2><p class="lead">실제 후보 등록 자격과 별개로, 능력치 조건은 게임 난이도를 위한 가상 규칙이야. 선거 일정도 게임용으로 단순화했어.</p>${[['local','지방의회 도전',d.local],['assembly','국회의원 도전',d.general],['president','대통령 도전',d.pres]].map(([type,title,due])=>{let r=electionReadiness(type),missing=r.items.filter(x=>!x.ok).length,attempted=g.electionLast===g.year;return `<details ${type==='local'||due?'open':''}><summary>${title} · ${due?'선거 연도':'다음 '+nextElectionYear(type)+'년'} · ${r.qualify?'조건 달성':'부족 '+missing+'개'}</summary>${nominationChecklist(type)}<div class="chiprow"><span>공천 심사 지표 ${r.nominationScore} / 기준 ${r.rule.nomination}</span><span>본선 경쟁력 지표 ${r.voteScore} / 참고 ${r.rule.election}</span></div><p class="reqfoot">공천은 3장면, 본선은 3장면의 선거 과정으로 진행돼. 준비 지표와 선택, 돌발 변수가 종합 반영되며 실제 선거를 예측하지 않아.</p><button class="btn ${due&&r.qualify&&!attempted?'primary':'subtle'} full" ${due&&r.qualify&&!attempted?'':'disabled'} onclick="tryNomination('${type}')">${!due?'선거 연도 대기':attempted?'올해 이미 선거에 도전함':r.qualify?'공천 경선 시작':'최소 요구치 충족 필요'}</button></details>`}).join('')}<p class="source">현실의 법정 요건과 게임 능력치 요건은 다릅니다. 실존 정당과 인물을 배경으로 한 대체 역사이며 공천 결과, 유권자 투표, 인물 관계는 창작입니다.</p></div>`}
function timelineHtml(){let g=game;return `<div class="paper"><div class="eyebrow">CHRONICLE</div><h2 class="serif">${safe(g.name)}의 연대기</h2><p class="lead">출신: ${safe(g.career)} · ${safe(g.backstory)}<br>활동 지역: ${safe(g.region)} · 소속: ${safe(g.party)}</p>${g.history.map(h=>`<div class="timelineitem"><span class="eyebrow">${h.y}년 ${h.q||''}분기</span><br><b>${safe(h.t)}</b><p>${safe(h.d)}</p></div>`).join('')}</div><div class="paper"><h2 class="serif" style="font-size:18px">이행 추적 중인 약속</h2>${g.promises.length?g.promises.slice(-12).reverse().map(x=>`<div class="listitem"><b>${safe(x.label)}</b> · ${safe(x.status)}<br><span class="muted tiny">제안: ${x.created}년</span></div>`).join(''):'<p class="lead">기록된 약속이 없어.</p>'}</div>`}
function moreHtml(){let g=game;return `<div class="paper"><div class="eyebrow">PROFILE & DATA</div><h2 class="serif">${safe(g.name)}의 능력치</h2>${statHtml()}<div class="hr"></div><p class="lead">정계 입문 경로: ${safe(g.backstory)}<br>현재 나이: ${g.age}세 · 자산: ${g.wealth.toFixed(2)}억 원</p><button class="btn subtle full" onclick="exportSave()">저장 데이터 파일로 내보내기</button><label class="label">저장 파일 불러오기</label><input type="file" class="field" accept="application/json,.json" onchange="importSave(this)"><div class="hr"></div><button class="btn warn full" onclick="restart()">인생 초기화하고 다시 시작</button><details><summary>역사적 사실과 게임 창작의 구분</summary><p class="lead">정당과 이름 있는 NPC는 실존 인물·정당의 출발 시점 정보를 참고했어. 게임의 개별 사건, 공천, 선거 결과, 사람 사이의 가상 관계 수치는 사실 관계와 무관한 창작 시뮬레이션이야. 2026년 주요 인물과 직함은 2026-10-27 공개 일정 기준이야.</p><p class="source"><a target="_blank" rel="noopener" href="https://www.theminjoo.kr/">더불어민주당 공식 사이트</a> · <a target="_blank" rel="noopener" href="https://www.peoplepowerparty.kr/">국민의힘 공식 사이트</a> · <a target="_blank" rel="noopener" href="https://www.nec.go.kr/">중앙선거관리위원회</a></p></details></div>`}
function exportSave(){let data=JSON.stringify(game,null,2),b=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='political-life-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importSave(el){let file=el.files[0];if(!file)return;try{let s=JSON.parse(await file.text());if(s.v!==1||!s.stats||!s.party||!s.year)throw new Error('잘못된 데이터');game=s;game.campaign??=null;game.broadcast??=null;repairRelations(game);mode=s.pending?'outcome':'event';screen=(game.broadcast||game.campaign)?'politics':'event';save();render()}catch(e){alert('올바른 저장 파일이 아니야.')} }
function restart(){if(!confirm('현재 게임을 초기화할까? 이 진행 데이터는 삭제돼.'))return;try{localStorage.removeItem(KEY)}catch(e){}freshStart()}
function render(){document.body.dataset.era=String(game?.era||setup.era);let target=$('app');if(!target)return;if(!game){target.innerHTML=setupHtml();return}if(game.broadcast)screen="politics";target.innerHTML=head()+`<main class="page">${({event:sceneHtml,people:contactsHtml,politics:politicsHtml,record:timelineHtml,more:moreHtml}[screen]||sceneHtml)()}</main>`+nav();if(game.broadcast&&!game.broadcast.done)setTimeout(playCount,100)}
main();
</script></body></html>
