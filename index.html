   s.ending = s.president?'대통령 당선':s.leadership?'정당 지도부 경력':s.peakOffice==='국회의원'?'국회의원 경력':s.peakOffice==='광역·기초단체장'?'지역 행정가':s.peakOffice==='지방의회의원'?'지역 정치인':s.bankruptcies>0?'재기와 도전의 인생':s.track==='pro'?'전문직 경력':s.track==='biz'?'사업가의 인생':'평범한 시민의 인생';
   s.history.push({year:s.year,age:s.age,title:'인생 마무리',text:`${s.ending}으로 남은 인생을 정리했다.`});archive(s);
   result.title='정치 인생 종료';result.text+=` ${s.ending}의 기록을 남기고 은퇴했다.`;}
 const diff=STATS.map(([id,label])=>({label,num:s.stats[id]-old[id]})).filter(o=>o.num!==0).sort((a,b)=>Math.abs(b.num)-Math.abs(a.num));
 overlay={...result,year,nextYear:s.year,age:s.age,changes:diff.slice(0,3),moneyDelta:result.moneyBefore==null?null:Math.round((s.money-result.moneyBefore)*100)/100,stage:'decision',done:s.gameover,sceneKey:`${s.seed}-${year}-${s.turn}`};save();render();
}

function runElection(type){
 const s=current;if(!s||s.gameover||overlay)return;const opt=electionsDue(s).find(x=>x.id===type);
 if(!opt||s.lastElectionYear===s.year)return;
 const old={...s.stats};s.lastElectionYear=s.year;
 const titles={council:'지방의회의원',mayor:'광역·기초단체장',assembly:'국회의원',president:'대통령'};
 const party=partyName(s),majorWins=s.elections.filter(x=>x.won).length,highWins=s.elections.filter(x=>x.won&&['국회의원','광역·기초단체장'].includes(x.title)).length;
 const trust=s.stats.trust,net=s.stats.network,fame=s.stats.fame,org=s.stats.org,policy=s.stats.policy,speech=s.stats.speech;
 // Single-player career game probabilities. They are not forecasts of real elections or parties.
 let nominationChance;
 if(type==='president'){
  s.presidentAttempts=(s.presidentAttempts||0)+1;
  nominationChance=clamp(2+(fame-68)*.34+(net-70)*.35+(org-65)*.15+highWins*3.5+(s.leadership?9:0),1.5,31);
  nominationChance*=Math.max(.18,1-(s.presidentAttempts-1)*.20);
  if(!highWins&&!s.leadership)nominationChance*=.32;
 }else{
  const diff={council:0,mayor:16,assembly:12}[type];
  nominationChance=clamp(25+(net-43)*.42+(org-43)*.32+(trust-45)*.15+majorWins*4-diff,7,83);
 }
 if(s.financialState==='distressed')nominationChance*=.62;
 // Independent candidacy skips party nomination, but has less campaign structure.
 const nominated=party==='무소속'||r(s)*100<nominationChance;
 let won=false,share=null,note='';
 if(!nominated){note=`${party} 내부의 가상 공천 경선에서 패배했다. 유권자 본선에는 출마하지 못했다.`;s.politicalSetbacks++;
   apply(s,{stats:{speech:2,org:1,network:-2}});}
 else{
  const spend=Math.min(s.money,type==='president'?1.8:type==='assembly'?.65:.42);
  s.money=clamp(s.money-spend,0,500);
  let winChance;
  if(type==='president'){
    winChance=clamp(1+(fame-70)*.22+(trust-70)*.24+(speech-70)*.09+(policy-70)*.09+highWins*1.8+(s.leadership?5:0)+(net-70)*.09,1,19);
    winChance*=Math.max(.15,1-(s.presidentAttempts-1)*.16);
    if(!highWins&&!s.leadership)winChance*=.19;
    if(party==='무소속')winChance*=.10;
  }else{
    const base={council:21,mayor:9,assembly:12}[type];
    winChance=clamp(base+(trust-48)*.34+(fame-45)*.29+(org-45)*.17+(speech-45)*.14+majorWins*3+(spend>.2?3:0),4,70);
    if(party==='무소속')winChance*=.65;
  }
  if(s.financialState==='distressed')winChance*=.68;
  won=r(s)*100<winChance;
  share=won?50+8*r(s):24+25*r(s);
  if(won){const office=titles[type];if(!s.achievements.includes(office+' 당선'))s.achievements.push(office+' 당선');
    s.office=office;s.peakOffice=office;s.officeUntil=s.year+(type==='president'?5:4);s.stats.fame=clamp(s.stats.fame+(type==='president'?30:11));s.stats.network=clamp(s.stats.network+7);s.stats.trust=clamp(s.stats.trust+4);
    if(type==='president'){s.president=true;s.gameover=true;s.ending='대통령 당선 · 최고 엔딩';}
  }else {s.politicalSetbacks++;apply(s,{stats:{speech:2,org:2,fame:1,trust:-3}});}
  note=`${titles[type]} 선거에서 가상 경쟁 후보와 맞붙어 득표율 ${share.toFixed(1)}%를 기록했다. ${won?'당선!':'낙선했다.'}`;
 }
 s.elections.push({year:s.year,title:titles[type],party,nomination:nominated,share,won});
 s.history.push({year:s.year,age:s.age,title:titles[type]+' '+(won?'당선':nominated?'낙선':'공천 실패'),text:note});
 if(s.president){archive(s);overlay={title:'대한민국 대통령 당선 · 전설 엔딩',year:s.year,
 text:`${s.name}의 오랜 도전이 가상 대통령 선거의 승리로 이어졌다. 당선 연령 ${s.age}세. 모든 인생에서 나오는 결과가 아닌 최고의 엔딩이다.`,changes:[],stage:'outcome',done:true,president:true};save();render();return;}
 finishTurn(s,old,{title:won?'선거 승리':nominated?'선거 낙선':'공천 탈락',text:note,label:opt.title});
}

 ${invitations.length?invitations.map(x=>`<div class="invite"><b>${esc(x.party)}</b><span class="tag">가상 접촉</span><p class="small">${esc(x.stage)}</p><p class="caption">관심 지표 ${x.score} / 100 · ${x.year}년 연락. 공천·당선을 보장하지 않아.</p><div class="row"><button class="btn primary slim" onclick="acceptInvitation('${esc(x.id)}')">제안 수락</button><button class="btn ghost slim" onclick="declineInvitation('${esc(x.id)}')">보류</button></div></div>`).join(''):'<div class="no-events mt8">아직 정당에서 연락이 오지 않았어. 사건에서 활동 실적을 쌓으면 향후 접촉이 발생할 수 있어.</div>'}</div>
 <details class="fold"><summary>▸ 시대별 주요 정당의 관심 분야 보기 (게임 모델)</summary><div class="foldbody"><p class="caption">실제 정당의 강령을 단순화한 게임용 분야 가중치야. 모든 정당이 인권·경제·복지·안전 등을 함께 다루며 한 가지 행동만으로 소속이 자동 결정되지는 않아. 관심 점수는 현실 정치인에 대한 평가나 선거 전망이 아님.</p>${names.map(p=>`<div class="listitem"><strong>${esc(p)}</strong><p>내 활동 분야와 경력을 반영한 게임상 접촉 지표 ${partySuitability(s,p)} / 100</p></div>`).join('')}</div></details>
 <div class="block-title">선거 출마</div><div class="card"><div class="row between"><span class="label">${s.year}년 선거 일정</span><span class="tag">${s.age}세</span></div>${s.age<minimum?`<div class="no-events">게임의 해당 시대 피선거권 연령까지 ${minimum-s.age}년 남았어.</div>`:!due.length?'<div class="no-events">올해는 예정된 시뮬레이션 선거가 없어.</div>':due.map(x=>`<div class="listitem"><div class="row between"><div class="grow"><strong>${esc(x.title)}</strong><p>${esc(x.desc)}. 정당 소속이면 별도 공천 심사, 무소속이면 독립 출마.</p></div><button class="btn slim ${x.id==='president'?'primary':'ghost'}" onclick="runElection('${x.id}')" ${s.gameover?'disabled':''}>도전</button></div></div>`).join('')}<div class="divider"></div><p class="caption">공천 심사와 선거는 가상 결과야. 지역별 실제 득표율을 예측하지 않아. 국회의원·지방선거 피선거권은 2022년부터 18세, 대통령은 40세.</p></div>
 <details class="fold"><summary>▸ 실제 법률과 게임 모델의 차이</summary><div class="foldbody"><p class="sub">현실에서는 가입 요건을 충족하면 본인이 자발적으로 입당을 신청할 수도 있어. 이 게임에서는 현실감을 위한 난이도 규칙으로 ‘정당의 접촉’을 거쳐 소속을 변경하도록 단순화했어. 공천은 당별 심사와 경선 절차가 필요해.</p></div></details>${historicalBanner(s)}</main>`;
}
function record(s){const rec=getArchive();return `<main class="screen"><div class="profiletop"><div class="eyebrow">MY POLITICAL LEGACY</div><h1 class="h1">정치 연대기</h1><p class="sub">지금까지 걸어온 인생과 선거 결과, 다음 인생의 기록을 확인해.</p></div><div class="card highlight"><div class="row between"><div><span class="label">${s.president?'최종 목표 달성':'현재까지의 이야기'}</span><h2>${esc(s.name)}의 정치 인생</h2></div><span class="tag gold">${s.year}년</span></div><div class="progress-strip"><div class="metric"><span class="text">현재 나이</span><b class="num">${s.age}</b></div><div class="metric"><span class="text">선거 출마</span><b class="num">${s.elections.length}</b></div><div class="metric"><span class="text">당선 횟수</span><b class="num">${s.elections.filter(x=>x.won).length}</b></div></div></div><div class="block-title">인생 연대기</div><div class="card"><div class="timeline">${s.history.slice().reverse().slice(0,60).map(h=>`<div class="timeitem"><small>${h.year}년 · ${h.age}세</small><strong>${esc(h.title)}</strong><p>${esc(h.text)}</p></div>`).join('')}</div></div>${s.gameover?`<div class="card highlight"><span class="label">이번 인생의 엔딩</span><h2>${esc(s.ending||'정치 인생 마무리')}</h2><p class="caption">대통령 당선은 희귀 최고 엔딩. 다른 직업·지역 정치·낙선·사업 실패 역시 각기 다른 기록으로 남아.</p></div>`:''}${s.elections.length?`<div class="card"><span class="label">선거 기록</span>${s.elections.slice().reverse().map(x=>`<div class="listitem"><strong>${x.year} ${esc(x.title)} ${x.won?'<span class="good">당선</span>':'<span class="bad">미당선</span>'}</strong><p>${esc(x.party)} · ${x.share==null?'공천 심사 탈락':`득표율 ${fmt(x.share)}%`}</p></div>`).join('')}</div>`:''}<div class="card"><span class="label">내 게임 관리</span><p class="caption">이 기기의 브라우저에 자동 저장돼. 기록을 파일로 내보낼 수도 있어.</p><div class="row wrap mt8"><button class="btn slim ghost" onclick="exportGame()">↓ 저장 파일 내보내기</button><button class="btn slim ghost" onclick="document.getElementById('importGame').click()">↑ 불러오기</button></div><input type="file" id="importGame" accept=".json,application/json" style="display:none" onchange="importGame(event)"><div class="divider"></div><button class="btn primary full" onclick="newGame()">↻ 다른 시대에서 새 인생 시작</button></div>${rec.length?`<div class="card"><span class="label">이전 인생 기록</span>${rec.map(x=>`<div class="listitem"><strong>${esc(x.name)} · ${x.success?'대통령 당선':'정치 인생 종료'}</strong><p>${esc(x.era)} / ${x.year}년 · ${x.age}세 · ${esc(x.office)}</p></div>`).join('')}</div>`:''}<div class="source-footer">출처·제도 참고: <a href="https://www.nec.go.kr" target="_blank" rel="noopener">중앙선거관리위원회</a> · <a href="https://easylaw.go.kr" target="_blank" rel="noopener">찾기쉬운 생활법령정보</a> · <a href="https://www.archives.go.kr" target="_blank" rel="noopener">국가기록원</a><br>본 게임은 비공식 창작 시뮬레이션으로, 게임 속 사건은 실제 정당·정치인과 무관해. 게임의 사건과 개표 결과는 현실 선거에 대한 예측이 아니야.</div></main>`;}
function exportGame(){if(!current)return;const obj={kind:'class-to-president',version:3,date:new Date().toISOString(),data:current};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=url;a.download='political-life-'+current.year+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importGame(event){const file=event.target.files&&event.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.kind!=='class-to-president'||![1,2,3].includes(d.version)||!d.data||!d.data.stats||!Number.isInteger(d.data.year))throw new Error('file');current=d.data;current.version=3;current.issues??=INIT_ISSUES();current.family??=familyInfo(current.seed||1234,current.region||'서울');current.invitations??=[];current.invitationHistory??=[];current.recentEventIds??=[];current.partyLabel??=(current.partyIndex!=null?getParties(current.year)[current.partyIndex]:null);tab='story';overlay=null;save();render();}catch(e){alert('올바른 정치 인생 저장 파일이 아니야.')}event.target.value='';}
// A short interactive story sequence makes each decision readable as a lived event.
let sceneTimer=null;
function prefersQuietMotion(){return !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;}
function cancelSceneTimer(){if(sceneTimer!==null){clearTimeout(sceneTimer);sceneTimer=null;}}
function scheduleScene(){
 cancelSceneTimer();if(!overlay)return;
 const key=overlay.sceneKey,step=overlay.stage||'outcome';
 if(step==='decision'||step==='chapter'){
  const duration=prefersQuietMotion()?(step==='decision'?120:160):(step==='decision'?1250:1550);
  sceneTimer=setTimeout(()=>{
   if(!overlay||overlay.sceneKey!==key||(overlay.stage||'outcome')!==step)return;
   if(step==='decision')showOutcome();else closeResult();
  },duration);
 }
}
function showOutcome(){if(!overlay)return;cancelSceneTimer();overlay.stage='outcome';render();}
function toNextChapter(){if(!overlay)return;cancelSceneTimer();if(overlay.done){closeResult();return;}overlay.stage='chapter';render();}
function sceneGlyph(t){const x=((t.eventTitle||'')+' '+(t.label||'')).toLowerCase();if(/선거|출마|공천|학생회장/.test(x))return '▤';if(/기업|투자|사업|계약|창업|금융|돈|임금/.test(x))return '◇';if(/의회|정당|정치|법안|행정/.test(x))return '⚖';if(/학교|교사|급식|시험|대학|연구|장학/.test(x))return '✎';if(/진료|보건|의료/.test(x))return '✚';return '✦';}
function consequenceNarrative(t){
 const changes=t.changes||[],up=changes.filter(c=>c.num>0),down=changes.filter(c=>c.num<0);
 const lossMoney=t.moneyDelta!==null&&t.moneyDelta<-0.04,earnMoney=t.moneyDelta!==null&&t.moneyDelta>0.04;
 let text='이번 선택도 한 해의 경험으로 남았다.';
 if(up.length&&down.length)text=`${up[0].label}에서 성과를 얻었지만, ${down[0].label}에서는 대가를 치렀다. 모든 선택이 이득으로만 이어지지는 않는다.`;
 else if(down.length)text=`${down[0].label}이(가) 떨어졌다. 눈앞의 문제는 지나갔어도 이 경험은 다음 선택에 부담으로 남을 수 있다.`;
 else if(up.length)text=`${up[0].label}이(가) 높아졌다. 쌓인 경험은 다음 사건을 마주할 때 새로운 선택지가 될 수 있다.`;
 if(lossMoney)text+=' 예상보다 재정적인 부담도 컸다.';
 else if(earnMoney)text+=' 재정적으로도 여유가 생겼다.';
 return text;
}
function resultModal(){
 if(!overlay)return '';
 const t=overlay,stage=t.stage||'outcome',isDone=!!t.done;
 const segments=`<div class="story-segments" aria-hidden="true"><i class="on"></i><i class="${stage!=='decision'?'on':''}"></i><i class="${stage==='chapter'?'on':''}"></i></div>`;
 let content='';
 if(stage==='decision'){
  content=`${segments}<div class="eyebrow">${esc(t.year)}년 · 그날의 선택</div><div class="scene-illustration"><span class="scene-glyph">${sceneGlyph(t)}</span><span class="scene-sub">THE MOMENT OF CHOICE</span></div><span class="scene-stamp">하나의 결정이 내려졌다</span><h2>${esc(t.eventTitle||t.title)}</h2><p class="scene-quote">“${esc(t.label||'한 걸음 내디뎠다')}”</p><div class="scene-narration">${esc(t.context||'지금 내린 결정을 실행하기 시작했다. 어떤 결과가 나올지는 아직 모른다.')}</div><p class="scene-footnote">결과를 확인하고 그 선택이 남긴 변화를 살펴보자.</p><button class="btn primary full" onclick="showOutcome()">결과 확인 →</button>`;
 }else if(stage==='chapter'){
  const next=current&&!current.gameover?events(current):null;
  content=`${segments}<div class="eyebrow">TIME PASSES · 인생의 다음 장</div><div class="scene-illustration"><span class="scene-glyph">⌛</span><span class="scene-sub">A NEW CHAPTER</span></div><div class="scene-years"><span class="last-year">${esc(t.year)}</span><span class="year-arrow">→</span><span class="new-year">${esc(t.nextYear??t.year+1)}</span></div><div class="scene-next-title"><span class="scene-next">${esc(t.age??current?.age??'')}세 · ${esc(current?phase(current):'새로운 일상')}</span><div>${next?esc(next.title):'새로운 한 해가 시작됐다'}</div><small>당신의 인생에 또 다른 사건이 찾아온다.</small></div><button class="btn primary full" onclick="closeResult()">바로 다음 장으로 →</button>`;
 }else{
  const numberCards=t.changes?.length?`<div class="resultnumbers">${t.changes.map(d=>`<div><b class="${d.num>=0?'good':'bad'}">${d.num>0?'+':''}${d.num}</b><span>${esc(d.label)}</span></div>`).join('')}</div>`:'';
  let finances=t.moneyDelta!==null&&Number.isFinite(t.moneyDelta)&&Math.abs(t.moneyDelta)>.005?`<div class="scene-finance"><span>올해 재산 변화</span><b class="${t.moneyDelta>=0?'good':'bad'}">${t.moneyDelta>0?'+':''}${t.moneyDelta.toFixed(2)}억원</b></div>`:'';
  const story=t.text||'한 해의 시간이 흘렀다.';
  const textParts=story.split(/\n\n(?=\[돌발 사건\]|\[새 연락\])/);
  const primaryStory=textParts.shift()||story;
  const addenda=textParts.map(v=>`<div class="scene-milestone">${esc(v.trim())}</div>`).join('');
  content=`${segments}<div class="eyebrow">${t.president?'THE HIGHEST ENDING':`DECISION RESULT · ${esc(t.year)}년`}</div><span class="scene-stamp">${esc(t.president?'대통령 당선':t.title)}</span><h2>${esc(t.eventTitle||t.title)}</h2>${t.label?`<div class="caption" style="margin:10px 0">선택한 행동 · ${esc(t.label)}</div>`:''}<div class="scene-narration"><strong>그 뒤에 일어난 일</strong><p class="scene-result-text">${esc(primaryStory)}</p></div>${t.achievement?`<div class="scene-milestone">✦ 새 경력 획득 · ${esc(t.achievement)}</div>`:''}${t.invitationNotice?`<div class="scene-milestone">✉ 정당의 연락 · ${esc(t.invitationNotice)}<div class="caption">정치 탭에서 영입 제안을 확인할 수 있어.</div></div>`:''}${addenda}${t.issues?.length?`<div class="caption" style="margin:12px 0;color:var(--mint)">활동 기록 · ${t.issues.map(x=>`${esc(x.label)} +${x.num}`).join(' · ')}</div>`:''}${numberCards}${finances}<div class="scene-impact">${esc(consequenceNarrative(t))}</div>${t.president?'<div class="scene-milestone">✦ 대통령 당선 · 이번 인생의 최고 엔딩</div>':''}<button class="btn primary full" onclick="toNextChapter()">${isDone?'나의 인생 기록 보기':'다음 장으로 →'}</button>`;
 }
 return `<div class="resultshade" role="presentation"><section class="resultbox" role="dialog" aria-modal="true" aria-label="선택의 결과"><div class="story-modal-content">${content}</div></section></div>`;
}
function closeResult(){cancelSceneTimer();const done=overlay?.done;overlay=null;if(done)tab='record';window.scrollTo({top:0,behavior:'instant'});render();}
function render(){const app=document.getElementById('app');if(!current){cancelSceneTimer();app.innerHTML=showOnboard();return;}const content=tab==='story'?story(current):tab==='activity'?activity(current):tab==='politics'?politics(current):record(current);app.innerHTML=head(current)+content+bottom()+resultModal();scheduleScene();}
current=load();if(!current)rollOrigin();else render();
</script>
</body></html>
