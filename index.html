 1988:['노태우','제13대 대통령 취임'],1993:['김영삼','제14대 대통령 취임'],1998:['김대중','제15대 대통령 취임'],

function pick(s,ar){return ar[Math.floor(r(s)*ar.length)];}
function staticRnd(num){let n=(num+0x6d2b79f5)>>>0;n=Math.imul(n^(n>>>15),n|1);n^=n+Math.imul(n^(n>>>7),n|61);return ((n^(n>>>14))>>>0)/4294967296;}
function rollOrigin(){ob.roll++;const q=((Date.now()+Math.random()*1e8+ob.roll*1831)>>>0);const b=BG[Math.floor(staticRnd(q)*BG.length)];const region=REGIONS[Math.floor(staticRnd(q+15)*REGIONS.length)];ob.origin={bg:b,region,seed:q};render();}

   s.debt=Math.max(0,(s.debt||0)-repay);
   if(s.debt<.12){s.debt=0;s.financialState='normal';extra='오랜 재정 정비 끝에 부채를 해결하고 다시 출발했다.';}
   else extra=`재기 중이다. 남은 부채는 ${fmt(s.debt)}억원이다.`;
 }
 if(opt.business){
    const roll=r(s),oldMoney=s.money;
    let delta;
    if(roll<.13){delta=-(1.8+r(s)*4.6);good=false;extra='대형 투자 실패! 핵심 사업이 무너지면서 자산이 크게 줄었다.';}
    else if(roll<.38){delta=-(.4+r(s)*1.75);good=false;extra='사업 매출이 급감하고 거래처가 이탈했다.';}
    else if(roll<.82){delta=.2+r(s)*1.05;extra='사업이 천천히 성장했다.';}
    else {delta=1.5+r(s)*3.2;extra='새로운 시장 진출이 성공해 사업이 크게 성장했다.';}
    const raw=oldMoney+delta;
    s.money=clamp(raw,0,500);
    if(raw<0){s.bankruptcies=(s.bankruptcies||0)+1;s.debt=+(Math.abs(raw)+s.debt).toFixed(2);s.financialState='distressed';
       apply(s,{stats:{network:-9,trust:-9,org:-4,fame:-3}});extra+=` 자금이 바닥나 부채 ${fmt(s.debt)}억원이 발생했다. 사업을 중단하고 재기를 준비해야 한다.`;
       if(s.bankruptcies>=3&&s.debt>=3&&s.age>=45){s.gameover=true;s.ending='사업 연쇄 실패';extra+=' 거듭된 실패 끝에 사업과 정계 도전 모두 멈추게 됐다.';}}
    else if(delta>2)apply(s,{stats:{network:5,fame:3}});
 }
 s.history.push({year:s.year,age:s.age,title:msg,text:extra||opt.d});
 finishTurn(s,old,{title:good?'선택의 결과':'예상치 못한 시련',text:extra||`${opt.n} — ${opt.d}`,label:msg});
}

function surprise(s){if(s.age<20||r(s)>.24)return '';const v=pick(s,SURPRISES);apply(s,{stats:v.stats});s.history.push({year:s.year,age:s.age,title:'돌발 사건 · '+v.title,text:v.text});return `\n\n[돌발 사건] ${v.title}: ${v.text}`;}
function finishTurn(s,old,result){
 const year=s.year,inc=yearIncome(s);s.money=clamp(s.money+inc,0,500);
 if(s.debt>0){const repay=Math.max(.03,Math.min(s.money*.09,.22));s.debt=Math.max(0,s.debt-repay);s.money=Math.max(0,s.money-repay);
  if(s.debt<.09){s.debt=0;s.financialState='normal';s.history.push({year:s.year,age:s.age,title:'빚 청산',text:'재정 위기를 극복했다.'});}}
 result.text+=surprise(s);
 if(s.age>=30){s.stats.fame=clamp(s.stats.fame-1);s.stats.trust=clamp(s.stats.trust-(r(s)<.38?1:0));}
 s.turn++;s.age++;s.year++;
 if(s.officeUntil&&s.year>=s.officeUntil&&s.office!=='대통령'){const former=s.office;s.office='전직 '+former;s.officeUntil=null;
 s.history.push({year:s.year,age:s.age,title:former+' 임기 종료',text:'선출직 임기를 마치고 새로운 도전을 준비한다.'});}
 if(s.gameover){s.ending||='사업 위기';archive(s);}
 else if(s.age>=70&&(s.age>=79||(r(s)<(s.age-69)*.012))){s.gameover=true;
   s.ending = s.president?'대통령 당선':s.leadership?'정당 지도부 경력':s.peakOffice==='국회의원'?'국회의원 경력':s.peakOffice==='광역·기초단체장'?'지역 행정가':s.peakOffice==='지방의회의원'?'지역 정치인':s.bankruptcies>0?'재기와 도전의 인생':s.track==='pro'?'전문직 경력':s.track==='biz'?'사업가의 인생':'평범한 시민의 인생';
   s.history.push({year:s.year,age:s.age,title:'인생 마무리',text:`${s.ending}으로 남은 인생을 정리했다.`});archive(s);
   result.title='정치 인생 종료';result.text+=` ${s.ending}의 기록을 남기고 은퇴했다.`;}
 const diff=STATS.map(([id,label])=>({label,num:s.stats[id]-old[id]})).filter(o=>o.num!==0).sort((a,b)=>Math.abs(b.num)-Math.abs(a.num));
 overlay={...result,year,changes:diff.slice(0,3),done:s.gameover};save();render();
}

function runElection(type){
 const s=current;if(!s||s.gameover||overlay)return;const opt=electionsDue(s).find(x=>x.id===type);
 if(!opt||s.lastElectionYear===s.year)return;
 const old={...s.stats};s.lastElectionYear=s.year;
 const titles={council:'지방의회의원',mayor:'광역·기초단체장',assembly:'국회의원',president:'대통령'};
 const party=partyName(s),majorWins=s.elections.filter(x=>x.won).length,highWins=s.elections.filter(x=>x.won&&['국회의원','광역·기초단체장'].includes(x.title)).length;
 const trust=s.stats.trust,net=s.stats.network,fame=s.stats.fame,org=s.stats.org,policy=s.stats.policy,speech=s.stats.speech;
 // Single-player career game probabilities. They are not forecasts of real elections or parties.
 let nominationChance;
 if(type==='president'){
  s.presidentAttempts=(s.presidentAttempts||0)+1;
  nominationChance=clamp(2+(fame-68)*.34+(net-70)*.35+(org-65)*.15+highWins*3.5+(s.leadership?9:0),1.5,31);
  nominationChance*=Math.max(.18,1-(s.presidentAttempts-1)*.20);
  if(!highWins&&!s.leadership)nominationChance*=.32;
 }else{
  const diff={council:0,mayor:16,assembly:12}[type];
  nominationChance=clamp(25+(net-43)*.42+(org-43)*.32+(trust-45)*.15+majorWins*4-diff,7,83);
 }
 if(s.financialState==='distressed')nominationChance*=.62;
 // Independent candidacy skips party nomination, but has less campaign structure.
 const nominated=party==='무소속'||r(s)*100<nominationChance;
 let won=false,share=null,note='';
 if(!nominated){note=`${party} 내부의 가상 공천 경선에서 패배했다. 유권자 본선에는 출마하지 못했다.`;s.politicalSetbacks++;
   apply(s,{stats:{speech:2,org:1,network:-2}});}
 else{
  const spend=Math.min(s.money,type==='president'?1.8:type==='assembly'?.65:.42);
  s.money=clamp(s.money-spend,0,500);
  let winChance;
  if(type==='president'){
    winChance=clamp(1+(fame-70)*.22+(trust-70)*.24+(speech-70)*.09+(policy-70)*.09+highWins*1.8+(s.leadership?5:0)+(net-70)*.09,1,19);
    winChance*=Math.max(.15,1-(s.presidentAttempts-1)*.16);
    if(!highWins&&!s.leadership)winChance*=.19;
    if(party==='무소속')winChance*=.10;
  }else{
    const base={council:21,mayor:9,assembly:12}[type];
    winChance=clamp(base+(trust-48)*.34+(fame-45)*.29+(org-45)*.17+(speech-45)*.14+majorWins*3+(spend>.2?3:0),4,70);
    if(party==='무소속')winChance*=.65;
  }
  if(s.financialState==='distressed')winChance*=.68;
  won=r(s)*100<winChance;
  share=won?50+8*r(s):24+25*r(s);
  if(won){const office=titles[type];if(!s.achievements.includes(office+' 당선'))s.achievements.push(office+' 당선');
    s.office=office;s.peakOffice=office;s.officeUntil=s.year+(type==='president'?5:4);s.stats.fame=clamp(s.stats.fame+(type==='president'?30:11));s.stats.network=clamp(s.stats.network+7);s.stats.trust=clamp(s.stats.trust+4);
    if(type==='president'){s.president=true;s.gameover=true;s.ending='대통령 당선 · 최고 엔딩';}
  }else {s.politicalSetbacks++;apply(s,{stats:{speech:2,org:2,fame:1,trust:-3}});}
  note=`${titles[type]} 선거에서 가상 경쟁 후보와 맞붙어 득표율 ${share.toFixed(1)}%를 기록했다. ${won?'당선!':'낙선했다.'}`;
 }
 s.elections.push({year:s.year,title:titles[type],party,nomination:nominated,share,won});
 s.history.push({year:s.year,age:s.age,title:titles[type]+' '+(won?'당선':nominated?'낙선':'공천 실패'),text:note});
 if(s.president){archive(s);overlay={title:'대한민국 대통령 당선 · 전설 엔딩',year:s.year,
 text:`${s.name}의 오랜 도전이 가상 대통령 선거의 승리로 이어졌다. 당선 연령 ${s.age}세. 모든 인생에서 나오는 결과가 아닌 최고의 엔딩이다.`,changes:[],done:true,president:true};save();render();return;}
 finishTurn(s,old,{title:won?'선거 승리':nominated?'선거 낙선':'공천 탈락',text:note,label:opt.title});
}

function joinParty(idx){const s=current;if(!s||s.gameover||overlay||s.age<joinMinAge(s))return;if(idx===s.partyIndex)return;const name=getParties(s.year)[idx];if(!name)return;const old=s.partyIndex;s.partyIndex=idx;if(old!=null){s.stats.trust=clamp(s.stats.trust-3);s.stats.network=clamp(s.stats.network-3)}else{s.stats.network=clamp(s.stats.network+4)}s.history.push({year:s.year,age:s.age,title:`정당 활동: ${name}`,text:old==null?'정당의 활동을 시작했다.':'소속 정당을 바꿨다.'});save();render();}

function head(s){return `<header class="mast"><div class="brand"><span class="seal">✦</span><div><small>POLITICAL LIFE</small><strong>교실에서 대통령 되기</strong></div></div><div class="headright"><span class="pill">${s.year} · ${s.age}세</span><button class="round-btn" title="설정·새 게임" onclick="tab='record';render()">⚙</button></div></header>`;}
function bottom(){const items=[['story','⌂','인생'],['activity','◉','성장'],['politics','♜','정치'],['record','▤','기록']];return `<nav class="bottomnav" aria-label="게임 메뉴">${items.map(([id,icon,t])=>`<button class="navbtn ${tab===id?'active':''}" onclick="tab='${id}';render()"><span class="navico">${icon}</span>${t}</button>`).join('')}</nav>`;}
function story(s){const evt=events(s),election=electionsDue(s);const step=clamp((s.age-17)/33*100,0,100);return `<main class="screen"><div class="profiletop"><div class="eyebrow">${esc(ERAS.find(e=>e.id===s.era).name)} 출발 · ${esc(phase(s))}</div><div class="profile-name">${esc(s.name)} <span class="tag gold">${s.age}세</span></div><div class="profile-rank">${esc(s.region)} · ${esc(partyName(s))} · ${esc(s.office)}</div></div><div class="progress-strip"><div class="metric"><span class="text">대중 인지도</span><span class="num">${s.stats.fame}</span><span class="text">/ 100</span></div><div class="metric"><span class="text">신뢰도</span><span class="num">${s.stats.trust}</span><span class="text">/ 100</span></div><div class="metric"><span class="text">현재 재산</span><span class="num">${fmt(s.money)}</span><span class="text">억원</span></div></div><div class="card highlight"><div class="row between"><span class="label">제 ${s.turn+1}장 · ${s.year}년</span><span class="tag">${esc(phase(s))}</span></div><h2>${esc(evt.title)}</h2><p class="sub m0">${esc(evt.text)}</p>${!s.gameover?evt.choices.map((c,i)=>`<button class="option" onclick="actionEvent(${i})"><span class="arrow">›</span><strong>${esc(c.n)}</strong><span>${esc(c.d)}</span></button>`).join(''):'<div class="no-events">이 인생은 종료되었어. 기록에서 새 인생을 시작할 수 있어.</div>'}</div>${election.length&&!s.gameover?`<div class="news"><b>🗳 ${s.year}년 선거 일정</b><br>올해 출마할 수 있는 선거 ${election.length}개. 아래 정치 탭에서 도전할 수 있어.</div>`:''}<div class="block-title">나의 정치 경로</div><div class="card"><div class="row between"><span class="caption">대통령 출마 최소 연령까지</span><strong class="gold">${s.age>=40?'출마 연령 충족':`${40-s.age}년`}</strong></div><div class="bar mt8" style="height:9px"><div style="width:${step}%"></div></div><div class="caption mt8">${eligibleYearMsg(s)} · 실제 대통령 임기는 5년 단임</div><div class="divider"></div><div class="row between"><span class="caption">최근 성취</span><span class="tag">${s.achievements.length}개</span></div><p class="small">${s.achievements.length?esc(s.achievements.slice(-2).join(' · ')):'아직 특별한 경력 없음 — 선택에 따라 이야기가 바뀐다.'}</p></div>${historicalNews(s.year)}${historicalBanner(s)}</main>`;}
function historicalBanner(s){const people=REALPEOPLE[s.era];const starter=ERAS.find(e=>e.id===s.era);return `<details class="fold"><summary>▸ ${starter.year}년 출발 시대의 실제 정치 인물</summary><div class="foldbody">${people.map(p=>`<div class="listitem"><strong>${esc(p.n)}</strong><p>${esc(p.d)}</p></div>`).join('')}<p class="caption">실제 인물의 공개적으로 확인 가능한 직책·경력을 소개하는 자료 카드야. 게임에서 가상의 대화나 실제 선거 예측을 만들지는 않아.</p></div></details>`;}
function activity(s){return `<main class="screen"><div class="profiletop"><div class="eyebrow">CAREER DEVELOPMENT</div><h1 class="h1">능력치와 경력</h1><p class="sub">정치 생활에서 중요한 능력은 하나가 아니야. 연설, 정책, 협상, 신뢰가 다른 상황에서 작동해.</p></div><div class="card"><div class="row between"><strong>현재 능력치</strong><span class="tag">0~100</span></div>${statsHtml(s.stats)}</div><div class="card"><span class="label">현재 진로</span><h2>${esc(TRACKS.find(t=>t.id===s.track)?.name||'청년 정치')}</h2><p class="sub m0">${s.track==='youth'?'학생회·지역 활동에서 시작해 조직과 인지도를 높이는 정치 경로':s.track==='pro'?'전문직의 실적과 정책 전문성을 바탕으로 정계에 진출하는 경로':'사업에서 만든 재산과 조직 운영 경험을 공적 영역으로 확장하는 경로'}</p><div class="divider"></div><p class="caption">진로는 고정되어 있지 않아. 매년 등장하는 선택지를 통해 전문직·사업·정치 활동 사이를 이동할 수 있어.</p></div><div class="card"><span class="label">주요 경력</span>${s.leadership?'<div class="listitem"><strong>✦ 정당 지도부 경험</strong></div>':''}${s.achievements.length?s.achievements.map(a=>`<div class="listitem"><strong>✦ ${esc(a)}</strong></div>`).join(''):'<p class="sub">아직 주요 경력이 없어. 학생회장 선거부터 도전해 봐.</p>'}</div><div class="card"><span class="label">가정 및 재정</span><h3>${esc(BG.find(b=>b.id===s.background)?.name||'')}</h3><div class="row between"><span class="small">현재 재산</span><b class="gold">${asset(s)}</b></div><p class="caption mt8">누적 사업 실패 ${s.bankruptcies||0}회 · 미상환 부채 ${fmt(s.debt||0)}억원. 재산은 실제 공직자 재산신고나 현실 수입 통계가 아닌 가상 자원이야.</p></div></main>`;}
function politics(s){const names=getParties(s.year);const due=electionsDue(s);const minimum=s.year>=2022?18:25;return `<main class="screen"><div class="profiletop"><div class="eyebrow">ELECTION · PARTY · OFFICE</div><h1 class="h1">정치 무대</h1><p class="sub">실제 정당명을 기반으로 하되, 플레이어의 가상 정치 인생은 대체역사로 진행돼.</p></div><div class="card highlight"><div class="row between"><div><div class="label">현재 소속 정당</div><h2>${esc(partyName(s))}</h2></div><span class="tag gold">${s.year}년</span></div><p class="caption">${s.age<joinMinAge(s)?`정당 선택은 ${joinMinAge(s)}세 이후부터 게임에서 열려. 고교 때는 학생회·지역 활동을 진행해 봐.`:'아래 실제 정당명 가운데 소속을 선택할 수 있어. 정당 변경 시 신뢰·인맥이 달라질 수 있어. 정치인 당선은 결코 보장되지 않아.'}</p>${s.age>=joinMinAge(s)?`<div class="chips">${names.map((p,i)=>`<button class="btn slim ${s.partyIndex===i?'primary':'ghost'}" onclick="joinParty(${i})">${esc(p)}</button>`).join('')}</div>`:''}</div><div class="block-title">선거 출마</div><div class="card"><div class="row between"><span class="label">${s.year}년 선거 일정</span><span class="tag">${s.age}세</span></div>${s.age<minimum?`<div class="no-events">현재 시대의 선거 피선거권 연령까지 ${minimum-s.age}년 남았어.</div>`:!due.length?'<div class="no-events">올해 예정된 시뮬레이션 선거가 없어.<br>인생 탭에서 다음 해로 진행해 봐.</div>':due.map(x=>`<div class="listitem"><div class="row between"><div class="grow"><strong>${esc(x.title)}</strong><p>${esc(x.desc)}</p></div><button class="btn slim ${x.id==='president'?'primary':'ghost'}" onclick="runElection('${x.id}')" ${s.gameover?'disabled':''}>도전 →</button></div></div>`).join('')}<div class="divider"></div><p class="caption">국회의원·지방선거 피선거권은 2022년부터 만 18세, 그 이전은 만 25세로 단순화했어. 대통령 선거는 만 40세부터. 선거 연도는 학습·게임용 간략 일정이며 중간의 정치적 사건으로 인한 보궐선거 등은 모두 재현하지 않아.</p></div><details class="fold"><summary>▸ 정당 이름과 정치사의 실제 구분</summary><div class="foldbody"><p class="sub">과거 정당들의 합당·분당은 복잡해. 게임에서는 3~5개 선택 경로를 당시 주요 정당 이름으로 바꿔 보여주는 단순화 모델이야. 이것이 모든 당의 직접적인 승계 관계를 뜻하지는 않아.</p><p class="sub">2026년 이후 연표·선거 결과는 실제 미래 정치에 대한 전망이 아닌 완전히 가상의 이야기로 진행돼.</p></div></details>${historicalBanner(s)}</main>`;}
function record(s){const rec=getArchive();return `<main class="screen"><div class="profiletop"><div class="eyebrow">MY POLITICAL LEGACY</div><h1 class="h1">정치 연대기</h1><p class="sub">지금까지 걸어온 인생과 선거 결과, 다음 인생의 기록을 확인해.</p></div><div class="card highlight"><div class="row between"><div><span class="label">${s.president?'최종 목표 달성':'현재까지의 이야기'}</span><h2>${esc(s.name)}의 정치 인생</h2></div><span class="tag gold">${s.year}년</span></div><div class="progress-strip"><div class="metric"><span class="text">현재 나이</span><b class="num">${s.age}</b></div><div class="metric"><span class="text">선거 출마</span><b class="num">${s.elections.length}</b></div><div class="metric"><span class="text">당선 횟수</span><b class="num">${s.elections.filter(x=>x.won).length}</b></div></div></div><div class="block-title">인생 연대기</div><div class="card"><div class="timeline">${s.history.slice().reverse().slice(0,60).map(h=>`<div class="timeitem"><small>${h.year}년 · ${h.age}세</small><strong>${esc(h.title)}</strong><p>${esc(h.text)}</p></div>`).join('')}</div></div>${s.gameover?`<div class="card highlight"><span class="label">이번 인생의 엔딩</span><h2>${esc(s.ending||'정치 인생 마무리')}</h2><p class="caption">대통령 당선은 희귀 최고 엔딩. 다른 직업·지역 정치·낙선·사업 실패 역시 각기 다른 기록으로 남아.</p></div>`:''}${s.elections.length?`<div class="card"><span class="label">선거 기록</span>${s.elections.slice().reverse().map(x=>`<div class="listitem"><strong>${x.year} ${esc(x.title)} ${x.won?'<span class="good">당선</span>':'<span class="bad">미당선</span>'}</strong><p>${esc(x.party)} · ${x.share==null?'공천 심사 탈락':`득표율 ${fmt(x.share)}%`}</p></div>`).join('')}</div>`:''}<div class="card"><span class="label">내 게임 관리</span><p class="caption">이 기기의 브라우저에 자동 저장돼. 기록을 파일로 내보낼 수도 있어.</p><div class="row wrap mt8"><button class="btn slim ghost" onclick="exportGame()">↓ 저장 파일 내보내기</button><button class="btn slim ghost" onclick="document.getElementById('importGame').click()">↑ 불러오기</button></div><input type="file" id="importGame" accept=".json,application/json" style="display:none" onchange="importGame(event)"><div class="divider"></div><button class="btn primary full" onclick="newGame()">↻ 다른 시대에서 새 인생 시작</button></div>${rec.length?`<div class="card"><span class="label">이전 인생 기록</span>${rec.map(x=>`<div class="listitem"><strong>${esc(x.name)} · ${x.success?'대통령 당선':'정치 인생 종료'}</strong><p>${esc(x.era)} / ${x.year}년 · ${x.age}세 · ${esc(x.office)}</p></div>`).join('')}</div>`:''}<div class="source-footer">출처·제도 참고: <a href="https://www.nec.go.kr" target="_blank" rel="noopener">중앙선거관리위원회</a> · <a href="https://easylaw.go.kr" target="_blank" rel="noopener">찾기쉬운 생활법령정보</a> · <a href="https://www.archives.go.kr" target="_blank" rel="noopener">국가기록원</a><br>본 게임은 비공식 창작 시뮬레이션으로, 게임 속 사건은 실제 정당·정치인과 무관해. 게임의 사건과 개표 결과는 현실 선거에 대한 예측이 아니야.</div></main>`;}
function exportGame(){if(!current)return;const obj={kind:'class-to-president',version:2,date:new Date().toISOString(),data:current};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=url;a.download='political-life-'+current.year+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importGame(event){const file=event.target.files&&event.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.kind!=='class-to-president'||![1,2].includes(d.version)||!d.data||!d.data.stats||!Number.isInteger(d.data.year))throw new Error('file');current=d.data;tab='story';overlay=null;save();render();}catch(e){alert('올바른 정치 인생 저장 파일이 아니야.')}event.target.value='';}
function resultModal(){if(!overlay)return '';const t=overlay;return `<div class="resultshade"><div class="resultbox" role="dialog" aria-modal="true"><div class="eyebrow">${t.president?'PRESIDENT ELECT':'YOUR LIFE · '+t.year}</div><h2>${esc(t.title)}</h2><p>${esc(t.text)}</p>${t.changes?.length?`<div class="resultnumbers">${t.changes.map(d=>`<div><b class="${d.num>=0?'good':'bad'}">${d.num>0?'+':''}${d.num}</b><span>${esc(d.label)}</span></div>`).join('')}</div>`:''}${t.president?'<p class="gold">🏛 꿈을 이뤘다. 너의 정치 인생이 역사 속 한 페이지가 되었다.</p>':''}<button class="btn primary full" onclick="closeResult()">${t.done?'기록 보기':'다음 해로 →'}</button></div></div>`;}
function closeResult(){const done=overlay?.done;overlay=null;if(done)tab='record';render();}
function render(){const app=document.getElementById('app');if(!current){app.innerHTML=showOnboard();return;}const content=tab==='story'?story(current):tab==='activity'?activity(current):tab==='politics'?politics(current):record(current);app.innerHTML=head(current)+content+bottom()+resultModal();}
current=load();if(!current)rollOrigin();else render();
</script>
</body></html>
