g:12px;border:1px solid #cdd7d2;border-radius:10px;background:#fff;font-size:15px;color:var(--ink)}.label{font-size:12px;font-weight:800;color:var(--ink);display:block;margin:13px 0 7px}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{background:#f2f5f1;border:1px solid #e0e7e2;border-radius:10px;text-align:center;padding:10px 4px}.metric strong{display:block;font:800 19px 'DM Sans',sans-serif}.metric span{font-size:10px;color:var(--muted)}.statrow{display:grid;grid-template-columns:70px 1fr 25px;gap:8px;align-items:center;margin:11px 0;font-size:11px}.track{height:6px;background:#e2ebe6;border-radius:9px;overflow:hidden}.track>i{height:100%;display:block;background:var(--teal);border-radius:9px}.scene{animation:rise .32s both}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.eventkicker{font-size:11px;color:var(--coral);font-weight:900;letter-spacing:.8px}.eventtext{line-height:1.98;font-size:14px;word-break:keep-all;white-space:pre-line}.option{display:block;border:1px solid #d7dcd6;border-radius:12px;padding:14px;margin:9px 0;background:white;width:100%;text-align:left;color:#1c3030}.option b{display:block;font-size:13px;line-height:1.7}.option em{display:block;font-size:11px;line-height:1.7;color:#7b8c89;font-style:normal;margin-top:3px}.option:active{background:#ebf4ef}.stage{display:flex;align-items:center;gap:8px;margin:10px 0 15px}.stage .dot{height:6px;flex:1;background:#dce5df;border-radius:8px}.stage .dot.on{background:var(--teal)}.result{border-left:3px solid var(--teal);padding:5px 13px;background:#f2f7f3;border-radius:0 10px 10px 0;line-height:1.8;font-size:13px}.delta{display:flex;gap:5px;flex-wrap:wrap}.delta span{padding:5px 8px;background:#f4f5f1;border-radius:7px;font-size:11px;color:#335a51;font-weight:800}.delta span.neg{color:#a34d42;background:#fff0eb}.timelineitem{border-left:2px solid #d3dfd8;padding:1px 0 15px 14px;margin-left:7px;position:relative}.timelineitem:before{content:'';position:absolute;left:-5px;top:7px;background:var(--teal);height:8px;width:8px;border-radius:50%}.timelineitem b{font-size:13px}.timelineitem p{font-size:12px;color:var(--muted);line-height:1.65;margin:5px 0}.npc{display:flex;gap:10px;align-items:center;border-bottom:1px solid #e7eae6;padding:12px 0}.avatar{height:42px;width:42px;display:grid;place-items:center;background:#e5ebe6;border:1px solid #d1d9d2;border-radius:12px;font:900 15px 'Noto Serif KR';color:#28594f;flex:none}.npc>div:nth-child(2){flex:1}.npc small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.npc meter{width:74px;height:10px}.notice{padding:13px;background:#e9f2ed;border-radius:10px;font-size:12px;line-height:1.8;color:#406153}.source{font-size:11px;color:#6e7e79;line-height:1.6}details{background:white;border:1px solid var(--line);border-radius:12px;margin:11px 0;padding:0 12px}summary{padding:12px 0;font-weight:800;font-size:13px;cursor:pointer}.listitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.65}.listitem:last-child{border:none}.hr{height:1px;background:var(--line);margin:14px 0}.loading{font-weight:900;color:#24685e;letter-spacing:1px}.badge{border:1px solid #c8dcd2;color:#24685e;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:800}.stickyfoot{position:sticky;bottom:65px;background:linear-gradient(transparent,#f6f5f0 25%);padding:16px 0 8px}.fakenews{border-top:3px double #446963;padding-top:10px;font-family:'Noto Serif KR',serif;font-size:16px;line-height:1.75}.ending{background:#163d3e;color:#fff;border-radius:12px;padding:22px;text-align:center}.ending .serif{color:#fff}.inputhelp{font-size:10px;color:var(--muted);line-height:1.7;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.miniProgress{background:#e8eee9;border-radius:6px;height:6px;overflow:hidden}.miniProgress i{display:block;background:var(--teal);height:100%}.scrollnote{overflow:auto;max-height:280px}.noshadow{box-shadow:none}@media(max-width:360px){.paper{margin:10px;padding:14px}.brand{font-size:16px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
'use strict';
const KEY='c2p_reboot_1',HISTORYKEY='c2p_reboot_archive';const $=id=>document.getElementById(id);const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const draw=x=>x[rand(0,x.length-1)];const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Math.round(n);const percent=n=>`${num(n)}%`;
const ERAS=[{year:1988,name:'1980~90년대',desc:'민주화 이후 새로운 정치 질서'},{year:2008,name:'2000~10년대',desc:'정당 재편과 온라인 정치의 확산'},{year:2026,name:'2020년대 이후',desc:'청년 정치와 디지털 여론'}];
const PARTIES={1988:[{name:'평화민주당',bloc:'dem',people:['김대중'],leader:'김대중'},{name:'민주정의당',bloc:'con',people:['노태우'],leader:'노태우'},{name:'통일민주당',bloc:'con',people:['김영삼'],leader:'김영삼'},{name:'신민주공화당',bloc:'other',people:['김종필'],leader:'김종필'}],2008:[{name:'통합민주당',bloc:'dem',people:['정세균','손학규'],leader:'정세균'},{name:'한나라당',bloc:'con',people:['이명박','박희태','박근혜'],leader:'박희태'},{name:'자유선진당',bloc:'other',people:['이회창','심대평'],leader:'이회창'}],2026:[{name:'더불어민주당',bloc:'dem',people:['김민석','한병도'],leader:'김민석'},{name:'국민의힘',bloc:'con',people:['장동혁','정점식','임이자'],leader:'장동혁'},{name:'조국혁신당',bloc:'other',people:['신장식','김준형'],leader:'신장식'},{name:'개혁신당',bloc:'other',people:['이기인','천하람'],leader:'이기인'}]};
const REGIONS={dem:['광주 동구','광주 광산구','전남 목포시','전남 순천시','전남 여수시','전남 나주시','전북 전주시','전북 익산시','전북 군산시'],con:['부산 동래구','부산 사하구','부산 연제구','대구 수성구','대구 달서구','울산 남구','경남 창원시','경남 진주시','경남 김해시','경북 포항시','경북 구미시','경북 경주시'],other:['서울 은평구','서울 마포구','경기 수원시','경기 성남시','인천 부평구','대전 유성구','충북 청주시','충남 천안시','강원 춘천시','제주 제주시']};
const CAREERS=[{id:'youth',name:'청년 정치·시민사회',tags:['청년위원회','시민단체','의회 정책보좌'],desc:['대학 시절 공론장과 지역청년회의 운영 경험','청년주거 시민단체 실무와 주민 토론회 기획','지방의회 정책연구 보조와 정당 청년 조직 활동'],ages:[25,26,29],wealth:[.12,.31,.45],boost:{network:8,org:12,policy:2,rep:4}},{id:'law',name:'법조·전문직',tags:['변호사','공익소송','계약 분쟁'],desc:['중소기업 계약 소송을 주로 맡던 개업 변호사','무료 법률상담과 민사조정 경력이 있는 변호사','행정소송 경험이 많은 법률 전문가'],ages:[33,36,39],wealth:[1.3,2.2,3.4],boost:{policy:12,trust:5,network:3,org:-3}},{id:'health',name:'의료·공공보건',tags:['의료 현장','지역 보건','예산'],desc:['지역 병원에서 일하던 의사','보건 의료기관에서 지역 건강사업을 기획한 의료인','의료 사각지대 관련 단체 활동을 겸했던 의료인'],ages:[32,35,38],wealth:[.7,1.6,2.7],boost:{policy:9,trust:7,media:3,org:-3}},{id:'biz',name:'창업·기업 경영',tags:['창업','고용','자금 조달'],desc:['지역 소상공인 유통 플랫폼을 운영한 창업자','제조업 스타트업을 키운 기업인','중소기업 운영과 인사관리 경험이 있는 사업가'],ages:[32,36,43],wealth:[2.2,4.8,7.6],boost:{money:8,network:8,media:4,policy:-3}},{id:'edu',name:'교육·연구',tags:['교사','대학 연구','교육 정책'],desc:['공교육 현장의 교육과정 개선에 참여한 교사','지역 국립대 연구원과 교육 자문 경력이 있는 학자','청소년 교육사업과 장학 운영 경험이 있는 교육인'],ages:[30,34,38],wealth:[.6,1.1,1.8],boost:{policy:9,trust:8,media:-2,org:2}},{id:'labor',name:'노동·지역 활동',tags:['노동 현장','조직 운영','지역 민원'],desc:['노동 상담과 현장 조정 경력을 가진 활동가','지역 복지단체 사무국장 출신 인사','주민자치위원회와 민원 네트워크를 운영한 활동가'],ages:[27,31,36],wealth:[.15,.35,.75],boost:{org:10,trust:8,network:4,media:-3}}];
const STATLABEL={policy:'정책 설계',org:'조직 운영',network:'인맥',trust:'신뢰',media:'언론 대응',rep:'지역 기반'};
let game=null,setup={era:2026,options:[],pick:0,party:0,name:'',originSeed:0},screen='event',lastOutcome=null,mode='event';
function randomOrigins(){const ids=CAREERS.map(x=>x.id).sort(()=>Math.random()-.5).slice(0,4);if(!ids.includes('youth'))ids[0]='youth';setup.options=ids.map(id=>{let c=CAREERS.find(x=>x.id===id);return {...c,details:draw(c.desc),age:draw(c.ages),wealth:draw(c.wealth)}});setup.pick=0;setup.originSeed=rand(1,100000000);}
function selectedParty(){return PARTIES[setup.era][setup.party]||PARTIES[setup.era][0]}
function previewRegion(){let p=selectedParty(),a=REGIONS[p.bloc];return a[(setup.originSeed+setup.pick*7+setup.party*11)%a.length]}
function freshStart(){game=null;setup={era:2026,options:[],pick:0,party:0,name:'',originSeed:0};randomOrigins();render()}
function startGame(){let name=($('playerName')?.value||'').trim();if(!name){alert('주인공 이름을 입력해 줘.');return;}if(name.length>12){alert('이름은 12자 이내로 설정해 줘.');return;}let c=setup.options[setup.pick],p=selectedParty(),year=setup.era,area=previewRegion();let st={policy:rand(26,40),org:rand(23,39),network:rand(18,34),trust:rand(36,51),media:rand(22,38),rep:rand(10,19)};for(const [k,v] of Object.entries(c.boost))if(k in st)st[k]=clamp(st[k]+v);game={v:1,name,era:setup.era,year,quarter:1,turn:0,age:c.age,region:area,party:p.name,bloc:p.bloc,track:c.id,career:c.name,backstory:c.details,wealth:c.wealth,office:'정당 신인',stats:st,issue:{housing:0,transport:0,localbiz:0,education:0,welfare:0},relation:Object.fromEntries([...new Set(PARTIES[setup.era].flatMap(x=>x.people))].map(x=>[x,rand(36,60)])),support:rand(23,36),partyTrust:rand(22,34),promises:[],history:[],seen:[],pending:null,won:0,lost:0,electionLast:0,appeals:0,goals:{},over:false,displayRegion:area};game.history.push({y:year,q:1,t:'정계 입문',d:`${safe(name)}은(는) ${area}에서 ${p.name} 소속 신인 정치인으로 활동을 시작했다. ${c.details}.`});mode='event';screen='event';save();render();}
function save(){if(!game)return;try{localStorage.setItem(KEY,JSON.stringify(game));}catch(e){/* 저장이 제한된 환경에서도 플레이는 계속됨 */}}function load(){try{let g=JSON.parse(localStorage.getItem(KEY)||'null');if(g&&g.v===1&&g.stats&&g.party){g.promises??=[];g.seen??=[];g.issue??={};g.relation??={};g.history??=[];g.goals??={};g.pending??=null;return g}}catch(e){}return null}
function main(){game=load();if(game){mode=game.pending?'outcome':'event';screen='event'}else randomOrigins();render()}const humanDate=g=>`${g.year}년 ${g.quarter}분기`;
function partyData(){return PARTIES[game.era].find(p=>p.name===game.party)||PARTIES[game.era][0]}
function protagonist(){let g=game;return `${g.name} · ${g.office}`}
function person(n,extra=''){return n?`<span class="bold">${safe(n)}</span>${extra}`:''}
function statHtml(){return Object.entries(STATLABEL).map(([k,t])=>`<div class="statrow"><b>${t}</b><div class="track"><i style="width:${clamp(game.stats[k])}%"></i></div><b>${num(game.stats[k])}</b></div>`).join('')}
function nav(){return `<nav class="tabbar">${[['event','▤','사건'],['people','◎','인물'],['politics','▥','정치'],['record','◷','연대기'],['more','⚙','설정']].map(([k,i,t])=>`<button class="${screen===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${t}</button>`).join('')}</nav>`}

 add('amend','상임위 법률안 수정 협상','의정 활동',`${g.office}으로 활동하는 당신에게 위원회 심사 중인 법률안의 수정 의견이 전달됐다. 예산 추계는 연간 280억 원 규모이며 지원 범위와 시범사업 기간을 놓고 상반된 의견이 나왔다. ${opp}도(도) 실무 협상에 관여할 수 있다는 연락이 왔다.`,[
 ['2년 시범사업과 평가보고서 제출을 수정안에 넣는다','통과 협상 여지↑ · 지원 범위 축소',{policy:5,network:3},{partyTrust:1,support:0},'시범사업 조건과 평가 조항을 반영한 수정안이 작성됐다. 본회의 채택 여부는 별도의 표결 절차에 달려 있다.',78,opp,2],
 ['원안을 지키고 공개 토론으로 쟁점을 부각한다','정책 일관성↑ · 합의 난항',{media:5,network:-2},{partyTrust:1,support:1},'쟁점은 부각됐지만 수정안 합의가 지연됐다.',66,opp,-2],
 ['지원 대상을 좁히고 부대의견을 추가한다','예산 절감 · 수혜 범위 감소',{policy:4,org:2,trust:-1},{partyTrust:2,support:-1},'수혜 범위를 축소하는 수정 방향이 검토됐다. 지원을 기대하던 일부 주민들의 비판이 제기됐다.',74]

 ['현장 증언을 먼저 제시한다','공감 유발 · 비교 자료 부족',{media:4,trust:1},{partyTrust:0,support:2},'주민 증언은 주목받았으나 수치 분석 요구가 뒤따랐다.',80,ally,0],

 ],g=>g.office!=='정당 신인');

 ['추가 공청회부터 요청한다','숙의 확대 · 일정 지연',{trust:4,org:1,media:-2},{partyTrust:-1,support:2},'추가 공청회가 논의됐다. 일정 지연에 대한 당내 우려도 나왔다.',74,chief,-1]
 ],g=>g.office!=='정당 신인');

function pickEvent(){let g=game;let all=eventCards();let pool=all.filter(x=>!g.seen.includes(x.id));if(pool.length<3){g.seen=g.seen.slice(-4);pool=all.filter(x=>!g.seen.includes(x.id))}let index=(g.turn*3+g.age+g.party.length+rand(0,1000))%pool.length;return pool[index]||all[0]}
function ensureEvent(){if(!game||game.over||game.pending)return;if(!game.currentEvent){game.currentEvent=pickEvent();game.seen.push(game.currentEvent.id);save()}}
function sceneHtml(){let g=game;ensureEvent();if(g.over)return endHtml();if(g.pending)return resultHtml();let e=g.currentEvent;return `<div class="paper scene"><div class="row between"><span class="eyebrow">${humanDate(g)} / ${g.region}</span><span class="badge">${g.office}</span></div><div class="stage"><i class="dot on"></i><i class="dot"></i><i class="dot"></i></div><span class="eventkicker">${safe(e.topic)} · 제${g.turn+1}장</span><h1 class="serif">${safe(e.title)}</h1><p class="eventtext">${safe(e.desc)}</p><div class="hr"></div><div class="eyebrow">YOUR DECISION</div>${e.choices.map((c,i)=>`<button class="option" onclick="choose(${i})"><b>0${i+1} · ${safe(c[0])}</b><em>${safe(c[1])}</em></button>`).join('')}<p class="inputhelp">수치는 보정 없는 가상 게임 시뮬레이션이며, 선택 뒤 성공·실패와 예상 밖의 결과가 달라질 수 있습니다.</p></div><div class="paper"><div class="row between"><b class="small">현재 활동 상황</b><span class="tiny muted">정당 ${safe(g.party)}</span></div><div class="metricgrid"><div class="metric"><strong>${g.support}</strong><span>지역 지지도</span></div><div class="metric"><strong>${g.partyTrust}</strong><span>당내 신뢰</span></div><div class="metric"><strong>${g.wealth.toFixed(1)}</strong><span>자산 (억원)</span></div></div></div>`}
function choose(index){if(!game||game.pending||game.over)return;let g=game,e=g.currentEvent,c=e.choices[index];if(!c)return;let before={...g.stats,support:g.support,partyTrust:g.partyTrust,wealth:g.wealth};let win=rand(1,100)<=c[5];let mult=win?1:.32;for(let[k,v]of Object.entries(c[2]||{})){if(!(k in g.stats))continue;g.stats[k]=clamp(g.stats[k]+Math.round(v*mult)-(win?0:Math.max(1,Math.ceil(Math.abs(v)/2))))}for(let[k,v]of Object.entries(c[3]||{})){if(k==='support'||k==='partyTrust')g[k]=clamp(g[k]+Math.round(v*mult)-(win?0:1))}if(c[6])g.relation[c[6]]=clamp((g.relation[c[6]]||50)+(win?(c[7]||0):-(c[7]||0)));
 let loss=0;if(!win&&rand(1,100)<40){loss=+.1*rand(1,4);g.wealth=Math.max(0,g.wealth-loss)}
 let afterText=win?c[4]:`시도 과정에서 예상보다 큰 반발과 행정적 문제가 발생했다. ${c[4]} 성과는 일부에 그쳤고, 후속 보완 계획을 세워야 했다.`;
 if(!win){g.stats.trust=clamp(g.stats.trust-1);}
 if(win&&['rent','traffic','school','market'].includes(e.id)){g.promises.push({created:g.year,label:e.title,due:g.turn+rand(3,7),status:'진행 중',impact:rand(1,3)})}
 g.pending={title:e.title,choice:c[0],win,detail:afterText,changes:{...Object.fromEntries(Object.keys(g.stats).map(k=>[k,Math.round(g.stats[k]-before[k])])),support:g.support-before.support,partyTrust:g.partyTrust-before.partyTrust,wealth:+(g.wealth-before.wealth).toFixed(1)}};g.history.unshift({y:g.year,q:g.quarter,t:e.title,d:`${c[0]} · ${afterText}`,win});g.currentEvent=null;mode='outcome';save();render();window.scrollTo(0,0)}
function resultHtml(){let g=game,o=g.pending;return `<div class="paper scene"><div class="eyebrow">DECISION REPORT / ${humanDate(g)}</div><div class="stage"><i class="dot on"></i><i class="dot on"></i><i class="dot"></i></div><span class="tag ${o.win?'':'red'}">${o.win?'진행 성과':'예상 밖의 난관'}</span><h1 class="serif">${safe(o.title)}</h1><p class="lead">당신의 선택 · ${safe(o.choice)}</p><div class="result">${safe(o.detail)}</div><div class="hr"></div><b class="small">이번 사건이 남긴 변화</b><div class="delta" style="margin-top:10px">${Object.entries(o.changes).filter(([k,v])=>v!==0).map(([k,v])=>`<span class="${v<0?'neg':''}">${safe(STATLABEL[k]||{support:'지역 지지도',partyTrust:'당내 신뢰',wealth:'자산'}[k]||k)} ${v>0?'+':''}${v}</span>`).join('')||'<span>능력치 변화 없음 · 정치적 기록 추가</span>'}</div><p class="inputhelp">행동의 결과는 연대기에 기록됩니다. 일부 사건은 몇 분기 뒤 다시 영향을 미칩니다.</p><button class="btn primary full" onclick="nextQuarter()">다음 분기로 진행 →</button></div>`}
function nextQuarter(){if(!game||!game.pending)return;let g=game;g.pending=null;g.turn++;g.quarter++;if(g.quarter>4){g.quarter=1;g.year++;g.age++} // evaluate delayed commitments
 for(let p of g.promises){if(p.status!=='진행 중'||g.turn<p.due)continue;let success=rand(1,100)<clamp(g.stats.org*.6+g.stats.policy*.3+18,15,95);p.status=success?'이행':'지연';g.support=clamp(g.support+(success?p.impact:-p.impact));g.stats.trust=clamp(g.stats.trust+(success?2:-2));g.history.unshift({y:g.year,q:g.quarter,t:`이전 약속의 후속 결과 · ${p.label}`,d:success?'후속 일정과 결과가 공개되어 지역 지지가 소폭 높아졌다.':'약속의 실행이 지연되면서 결과를 설명해야 했다.'});}
 // resources/time
 if(g.turn%4===0){g.wealth=Math.max(0,+(g.wealth+({'youth':.09,law:.28,health:.24,biz:.36,edu:.12,labor:.11}[g.track]||.1)-(g.office==='정당 신인'?.08:.03)).toFixed(2));g.partyTrust=clamp(g.partyTrust+rand(-2,2));}
 // player aging and random news
 if(g.turn%5===0){g.support=clamp(g.support+rand(-3,2));g.history.unshift({y:g.year,q:g.quarter,t:'정치 환경 변화',d:'지역 현안과 유권자 관심사가 달라지면서 정치 활동의 우선순위를 다시 검토하게 되었다.'})}
 if(g.age>=75){g.over=true;g.history.unshift({y:g.year,q:g.quarter,t:'정계 은퇴',d:'오랜 정치 활동을 정리했다.'})}
 mode='event';save();render();window.scrollTo(0,0)}
function endHtml(){let g=game;return `<div class="paper"><div class="ending"><div class="eyebrow" style="color:#c9e4d6">CAREER COMPLETED</div><h1 class="serif">${safe(g.name)}의 정치 연대기</h1><p>${g.won}회 당선 · ${g.lost}회 낙선<br>최종 공직: ${safe(g.office)}</p></div><p class="lead">대통령 당선은 가능한 결말 중 하나일 뿐이며 모든 플레이에서 보장되지 않습니다.</p><button class="btn primary full" onclick="restart()">새 정치 인생 시작</button></div>`}
function contactsHtml(){let g=game;let people=Object.keys(g.relation);let parties=PARTIES[g.era];return `<div class="paper"><div class="eyebrow">PUBLIC FIGURES · ${g.era}</div><h2 class="serif">실존 정치인 관계망</h2><p class="lead">이름과 출발 시점의 소속은 역사적 사실을 참고했지만, 아래 관계 수치는 전부 게임 속 가상 지표야. 실제 정치인의 평가나 현실의 관계를 의미하지 않아.</p>${people.map(n=>{let p=parties.find(p=>p.people.includes(n));return `<div class="npc"><div class="avatar">${safe(n.slice(0,1))}</div><div><b>${safe(n)}</b><small>${safe(p?.name||'')} · 게임 속 관계도</small></div><div style="width:70px"><b class="small">${num(g.relation[n])}</b><div class="miniProgress"><i style="width:${g.relation[n]}%"></i></div></div></div>`}).join('')}<p class="source">게임에 등장하는 모든 이름 있는 NPC는 실제 역사·정치 인물입니다. 사건 속 발언이나 만남은 사실 보도가 아니라 가상 상황입니다.</p></div>`}
function electionDue(){let g=game;let y=g.year;let general=g.era===1988?y>=1988&&(y-1988)%4===0:g.era===2008?y>=2008&&(y-2008)%4===0:y>=2028&&(y-2028)%4===0;let local=g.era===1988?y>=1995&&(y-1995)%4===0:g.era===2008?y>=2010&&(y-2010)%4===0:y>=2030&&(y-2030)%4===0;let pres=g.era===1988?y>=1992&&(y-1992)%5===0:g.era===2008?y>=2012&&(y-2012)%5===0:y>=2030&&(y-2030)%5===0;return {general,local,pres}}
function electionReadiness(type){let g=game,base=g.stats.org*.22+g.stats.rep*.28+g.stats.media*.15+g.support*.22+g.partyTrust*.13;let margin=type==='president'?83:type==='assembly'?58:48;let qualify=type==='president'?g.age>=40&&g.won>=2:g.stats.org>=30;return {base:Math.round(base),margin,qualify}}
function tryNomination(type){
 let g=game;if(g.pending||g.over)return;let d=electionDue();if(type==='president'&&!d.pres||type==='assembly'&&!d.general||type==='local'&&!d.local){alert('아직 해당 선거의 출마 시기가 아니야.');return}
 if(g.electionLast===g.year){alert('이번 연도에는 이미 선거에 도전했어.');return}
 let rd=electionReadiness(type);if(!rd.qualify){alert(type==='president'?'대통령 도전은 만 40세 이상, 선출직 당선 경력 2회 이상이어야 해.':'조직 운영 능력을 더 쌓아야 출마를 준비할 수 있어.');return}
 // The party screening and the general election are two separate fictional checks.
 let office=type==='president'?'대통령':type==='assembly'?'국회의원':'지방의회의원';
 let nominationScore=g.partyTrust*.46+g.stats.org*.27+g.stats.network*.18+g.stats.policy*.09;
 let nominationBar=type==='president'?72:type==='assembly'?52:40;
 let nominationWon=nominationScore+rand(-22,22)>=nominationBar;
 let elected=false,firstMsg='';
 if(!nominationWon){g.partyTrust=clamp(g.partyTrust-3);firstMsg=`${g.party} 당내 공천 심사에서 후보 선출을 받지 못했다. 지역 조직력, 정책 발표, 내부 평가 자료가 종합적으로 검토되었지만 이번에는 최종 후보가 되지 못했다.`}
 else{
  let electionScore=g.support*.30+g.stats.rep*.23+g.stats.media*.18+g.stats.trust*.15+g.stats.org*.14;
  let electionBar=type==='president'?79:type==='assembly'?65:58;
  elected=electionScore+rand(-27,27)>=electionBar;
  if(elected){g.office=office;g.won++;g.support=clamp(g.support+8);g.partyTrust=clamp(g.partyTrust+5);g.stats.media=clamp(g.stats.media+4);if(office==='대통령')g.over=true}
  else{g.lost++;g.support=clamp(g.support-5);g.partyTrust=clamp(g.partyTrust-2)}
  firstMsg=`당내 공천 심사를 통과해 ${office} 선거에 출마했다. ${elected?`개표 결과 당선되었다. 이후 ${office}으로서 새로운 책임과 조정 과제가 시작된다.`:'하지만 본선에서 득표가 충분하지 않아 낙선했다. 지역 활동과 정치 경력을 유지하며 다음 기회를 모색할 수 있다.'}`;
 }
 g.electionLast=g.year;
 g.history.unshift({y:g.year,q:g.quarter,t:`${office} 도전 · ${!nominationWon?'공천 탈락':elected?'당선':'본선 낙선'}`,d:firstMsg});
 g.pending={title:`${office} 도전`,choice:'공천 심사에 신청했다',win:elected,detail:firstMsg,changes:{support:elected?8:nominationWon?-5:0,partyTrust:!nominationWon?-3:elected?5:-2}};
 save();screen='event';render();window.scrollTo(0,0);
}
function politicsHtml(){let g=game,d=electionDue(),p=partyData();return `<div class="paper"><div class="eyebrow">PARTY & ELECTORAL SYSTEM</div><h2 class="serif">정치 활동 상황</h2><div class="notice"><b>${safe(g.party)}</b> 소속 · ${safe(g.region)}<br>선택한 정당에서 시작하며, 공천과 선거는 별도의 절차입니다.</div><div class="metricgrid" style="margin-top:10px"><div class="metric"><strong>${g.support}</strong><span>지역 지지도</span></div><div class="metric"><strong>${g.partyTrust}</strong><span>당내 신뢰</span></div><div class="metric"><strong>${g.won}</strong><span>선출직 당선</span></div></div><h2 class="serif" style="font-size:19px;margin-top:25px">선거 도전</h2><p class="lead">아래 선거 일정은 게임용으로 단순화한 가상 일정이야. 공천 심사와 유권자 투표 결과는 통계가 아닌 난수 기반 게임 판정으로 결정돼.</p>${[['local','지방의회 도전',d.local],['assembly','국회의원 도전',d.general],['president','대통령 도전',d.pres]].map(([type,title,due])=>{let r=electionReadiness(type);return `<div class="choosecard"><div class="row between"><b>${title}</b><span class="tag ${due?'':'gray'}">${due?'해당 선거 연도':'일정 대기'}</span></div><p>출마 준비 지표 ${r.base} / 기준 참고치 ${r.margin} · ${type==='president'?'만 40세 이상 · 당선 경험 2회 이상':'조직 운영 경험 필요'}</p><button class="btn ${due?'primary':'subtle'} full" ${due?'':'disabled'} onclick="tryNomination('${type}')">${due?'공천 심사 및 출마 도전':'선거 일정까지 활동하기'}</button></div>`}).join('')}<div class="hr"></div><div class="source">2026년 기준 민주당·국민의힘 출발 지역은 요청에 따라 각각 호남·영남으로 설정했어. 실제 정당의 전국 활동을 제한하거나 지역 전체의 정치적 성향을 단정한 설정은 아니야.</div></div>`}
function timelineHtml(){let g=game;return `<div class="paper"><div class="eyebrow">CHRONICLE</div><h2 class="serif">${safe(g.name)}의 연대기</h2><p class="lead">출신: ${safe(g.career)} · ${safe(g.backstory)}<br>활동 지역: ${safe(g.region)} · 소속: ${safe(g.party)}</p>${g.history.map(h=>`<div class="timelineitem"><span class="eyebrow">${h.y}년 ${h.q||''}분기</span><br><b>${safe(h.t)}</b><p>${safe(h.d)}</p></div>`).join('')}</div><div class="paper"><h2 class="serif" style="font-size:18px">이행 추적 중인 약속</h2>${g.promises.length?g.promises.slice(-12).reverse().map(x=>`<div class="listitem"><b>${safe(x.label)}</b> · ${safe(x.status)}<br><span class="muted tiny">제안: ${x.created}년</span></div>`).join(''):'<p class="lead">기록된 약속이 없어.</p>'}</div>`}
function moreHtml(){let g=game;return `<div class="paper"><div class="eyebrow">PROFILE & DATA</div><h2 class="serif">${safe(g.name)}의 능력치</h2>${statHtml()}<div class="hr"></div><p class="lead">정계 입문 경로: ${safe(g.backstory)}<br>현재 나이: ${g.age}세 · 자산: ${g.wealth.toFixed(2)}억 원</p><button class="btn subtle full" onclick="exportSave()">저장 데이터 파일로 내보내기</button><label class="label">저장 파일 불러오기</label><input type="file" class="field" accept="application/json,.json" onchange="importSave(this)"><div class="hr"></div><button class="btn warn full" onclick="restart()">인생 초기화하고 다시 시작</button><details><summary>역사적 사실과 게임 창작의 구분</summary><p class="lead">정당과 이름 있는 NPC는 실존 인물·정당의 출발 시점 정보를 참고했어. 게임의 개별 사건, 공천, 선거 결과, 사람 사이의 가상 관계 수치는 사실 관계와 무관한 창작 시뮬레이션이야. 2026년 주요 인물과 직함은 2026-10-27 공개 일정 기준이야.</p><p class="source"><a target="_blank" rel="noopener" href="https://www.theminjoo.kr/">더불어민주당 공식 사이트</a> · <a target="_blank" rel="noopener" href="https://www.peoplepowerparty.kr/">국민의힘 공식 사이트</a> · <a target="_blank" rel="noopener" href="https://www.nec.go.kr/">중앙선거관리위원회</a></p></details></div>`}
function exportSave(){let data=JSON.stringify(game,null,2),b=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='political-life-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importSave(el){let file=el.files[0];if(!file)return;try{let s=JSON.parse(await file.text());if(s.v!==1||!s.stats||!s.party||!s.year)throw new Error('잘못된 데이터');game=s;mode=s.pending?'outcome':'event';screen='event';save();render()}catch(e){alert('올바른 저장 파일이 아니야.')} }
function restart(){if(!confirm('현재 게임을 초기화할까? 이 진행 데이터는 삭제돼.'))return;try{localStorage.removeItem(KEY)}catch(e){}freshStart()}
function render(){let target=$('app');if(!target)return;if(!game){target.innerHTML=setupHtml();return}target.innerHTML=head()+`<main class="page">${({event:sceneHtml,people:contactsHtml,politics:politicsHtml,record:timelineHtml,more:moreHtml}[screen]||sceneHtml)()}</main>`+nav()}
main();
</script></body></html>
